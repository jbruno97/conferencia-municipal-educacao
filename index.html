<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:var(--no);border-color:var(--no);color:#fff}button.on{border-color:var(--pr);color:var(--pr);font-weight:600}

#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#modal.show{display:flex}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tw{overflow-x:auto}

/* ================================================================================================== */
const DATA=[{"gt": "GT 1", "desc": "Eixo I.a – Metas 1 a 5", "metas": [{"num": 1, "title": "Acesso à Educação Infantil", "objetivo": "Ampliar a oferta de matrículas em creche e universalizar a pré-escola.", "metas": [{"id": "1.a", "texto": "Ampliar a oferta de educação infantil para atender 100% (cem por cento) da demanda manifesta por creche e, atingir, no mínimo, 60% (sessenta por cento) das crianças de até 3 (três) anos ao final da vigência deste Plano Municipal de Educação (PME)."}, {"id": "1.b", "texto": "Reduzir, a no máximo 10 p.p. (dez pontos percentuais), a desigualdade de acesso à creche entre as crianças do quintil de renda familiar per capita mais elevado e as do quintil de renda familiar per capita mais baixo o final da vigência deste PME."}, {"id": "1.c", "texto": "Universalizar, até o segundo ano do período de vigência deste PME, o acesso à educação infantil na pré-escola, para atender a todas as crianças de 4 (quatro) a 5 (cinco) anos."}], "estrategias": [{"id": "1.1", "texto": "Implementar políticas de construção, reestruturação e adequação de creches e escolas e de aquisição de equipamentos, através de regime de colaboração com o Estado e a União, considerando estrutura que garanta a sustentabilidade socioambiental e a arquitetura inclusiva, prioritariamente em unidades que atendam crianças em situações de vulnerabilidade socioeco-nômica e unidades localizadas em zonas periféricas e rurais, de forma a atender à demanda de acordo com as necessidades dos estudantes e garantir padrões nacionais de qualidade."}, {"id": "1.2", "texto": "Apoiar em regime de colaboração, a instituição de política de levantamento de demanda por creche e de busca ativa na educação infantil, com caráter informativo acerca do direito à matrícula da criança e a opção da família no caso das creches, coordenada e monitorada pela secretaria de educação, em parceria com órgãos públicos de assistência social ou de saúde e com outras instituições do Sistema de Garantia de Direitos da Criança e do adolescente (SGDCA), com vistas a aumentar o acesso e a reduzir a evasão e o abandono nessa etapa da educação básica."}, {"id": "1.3", "texto": "Definir e adotar, em regime de colaboração, instrumento nacional para levantamento da demanda por vagas em creches, em consonância com a Lei nº 14.851, de 3 de maio de 2024."}, {"id": "1.4", "texto": "Induzir a adoção de critérios e mecanismos de priorização de atendimento à demanda por creche, de modo a promover equidade étnico-racial e reduzir as desigualdades de nível socioeconômico."}, {"id": "1.5", "texto": "Promover políticas de equalização e fortalecer o acompanhamento e o monitoramento do acesso e da permanência das crianças na educação infantil, em especial aquelas em situação de vulnerabilidade socioeconômica, as negras, as indígenas, as quilombolas, as do campo, as das águas, as das florestas, as refugiadas e as que integram o público da educação especial, em colaboração com as famílias e com os órgãos públicos de assistência social, saúde e proteção à infância."}, {"id": "1.6", "texto": "Ampliar o acesso à educação infantil integral, com espaços e tempos apropriados às atividades educativas, de forma a garantir padrões nacionais de qualidade, com vistas a priorizar o atendimento das crianças em situações de vulnerabilidade socioeconômica."}, {"id": "1.7", "texto": "Publicizar, monitorar e avaliar as parcerias com entidades sem fins lucrativos, assegurando o cumprimento dos padrões nacionais de qualidade da educação infantil, bem como a observância dos critérios de transparência e a submissão aos mecanismos de controle social, interno e externo na forma da lei."}, {"id": "1.8", "texto": "Induzir a adoção de medidas para favorecer a alocação de profissionais do magistério experientes em escolas localizadas em áreas de difícil acesso ou que atendem crianças em situações de maior vulnerabilidade socioeconômica, negras, indígenas, quilombolas, do campo, das águas e das florestas, bem como o público da educação especial, com o objetivo de reduzir as desigualdades de aprendizagem e de proporcionar desenvolvimento integral das crianças."}, {"id": "1.9", "texto": "implementar politicas com vistas a extinguir turmas multietapas com estudantes da edu-cação infantil e do ensino fundamental, a fim de assegurar o atendimento das especificidades das crianças da educação infantil."}, {"id": "1.10", "texto": "Instituir parâmetros nacionais e regramentos que orientem e permitam, quando neces-sário processos de nucleação escolar na educação infantil, considerando os aspectos culturais, territoriais, de alimentação e de transporte escolar e a consulta às comunidades escolares envol-vidas."}, {"id": "1.11", "texto": "Promover politicas publicas especificas de assistência técnica e financeira para induzir a ampliação da oferta de creche e pré-escola em regiões e localidades com os menores índices de atendimento."}, {"id": "1.12", "texto": "Instituir, em regime de colaboração, campanha anual de comunicação voltada às famílias sobre o direito à creche e a obrigatoriedade de matricula na pré-escola."}]}, {"num": 2, "title": "Qualidade da Educação Infantil", "objetivo": "Garantir a qualidade da oferta de educação infantil.", "metas": [{"id": "2.a", "texto": "Assegurar que toda a oferta de creche alcance padrões nacionais de qualidade para a educação infantil, considerados, no mínimo, as dimensões de infraestrutura física, os profissio-nais da educação, as condições de gestão, os recursos pedagógicos, a acessibilidade e as práticas pedagógicas alinhadas a Base Nacional Comum Curricular (BNCC) e com intencionalidade educativa."}, {"id": "2.b", "texto": "Assegurar que toda a oferta de pré-escola alcance padrões nacionais de qualidade para educação infantil, considerados, no mínimo, as dimensões de infraestrutura física, os profissionais da educação, as condições de gestão, os recursos pedagógicos, a acessibilidade e as práticas pedagógicas alinhadas à BNCC e com intencionalidade educativa."}], "estrategias": [{"id": "2.1", "texto": "Revisar e implementar, em regime de colaboração, padrões nacionais de qualidade da educação infantil, abrangendo a infraestrutura, a alimentação, o transporte escolar e as condições de gestão, em especial o planejamento e a gestão pedagógica, os recursos pedagógicos, os profissionais da educação e o número de crianças por sala, de forma a respeitar o desenho universal de acessibilidade, a inclusão, as diversidades territoriais e as especificidades das etapas e das modalidades de ensino."}, {"id": "2.2", "texto": "Implementar e monitorar periodicamente, em regime de colaboração, as Diretrizes Ope-racionais Nacionais de Qualidade e Equidade para a Educação Infantil, considerando ações, responsáveis e prazos, de modo a orientar o planejamento e a execução de políticas públicas para a etapa."}, {"id": "2.3", "texto": "Incentivar práticas pedagógicas articuladas aos campos de experiência da educação infan-til, contempladas as áreas e os temas transversais previstos na Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), e na BNCC."}, {"id": "2.4", "texto": "Garantir a integração e a continuidade dos processos de aprendizagem das crianças entre a educação infantil e os anos iniciais do ensino fundamental, consideradas as especificidades de cada etapa."}, {"id": "2.5", "texto": "Garantir o acesso a uma variedade de recursos que possibilitem a ampla participação das crianças, como brinquedos, livros, materiais pedagógicos, áreas de contato com a natureza e áreas externas e internas devidamente organizadas."}, {"id": "2.6", "texto": "Ampliar o acesso a materiais para jogos e esportes e as oportunidades de formação continuada dos profissionais da educação infantil, a fim de incentivar práticas pedagógicas com interações e brincadeiras vinculadas ao movimento."}, {"id": "2.7", "texto": "Aperfeiçoar a avaliação nacional da educação infantil, com base em padrões nacionais de qualidade, com vistas a garantir a interpretação pedagógica dos resultados em faixas de qualidade nas dimensões de infraestrutura física, profissionais da educação, condições de gestão, recursos pedagógicos, acessibilidade, interações e práticas pedagógicas."}, {"id": "2.8", "texto": "Implementar, nas unidades escolares, múltiplas abordagens de avaliação do processo de desenvolvimento infantil, de acordo com as diretrizes curriculares nacionais para a Educação Infantil, com vistas a possibilitar a orientação e a reorientação do planejamento de educadores e equipes pedagógicas."}, {"id": "2.9", "texto": "Induzir processos de autoavaliação das escolas, com foco na melhoria contínua dos proces-sos de ensino-aprendizagem e desenvolvimento integral das crianças, e fortalecer os processos escolares de planejamento estratégico coletivo por meio da elaboração de projetos pedagógicos e de reuniões periódicas dos conselhos escolares e dos conselhos de classe, considerando a concepção de educação e cuidado como aspectos indissociáveis das ações dirigidas às crianças e a promoção da melhoria da qualidade da educação infantil."}, {"id": "2.10", "texto": "Estabelecer índice de qualidade da educação infantil, orientado pelos padrões nacionais de qualidade da educação infantil, para monitoramento periódico."}, {"id": "2.11", "texto": "Induzir processos de formação das equipes gestoras das escolas, tendo em vista a imple-mentação de parâmetros nacionais de qualidade da educação infantil."}, {"id": "2.12", "texto": "Fortalecer a capacidade técnica e administrativa da Secretaria Municipal de Educação para promover o apoio pedagógico e de gestão escolar às unidades de educação infantil."}, {"id": "2.13", "texto": "Implementar e fortalecer políticas e a articulação intersetorial, em regime de colabo-ração, entre as áreas de educação, saúde, assistência social, esporte e cultura, com foco no desenvolvimento integral das crianças."}, {"id": "2.14", "texto": "Fortalecer a política nacional de formação inicial e continuada para a educação infantil, com ênfase nos objetivos de aprendizagem dos campos de experiência da educação infantil e de desenvolvimento integral da criança e no dever do Estado em relação à qualidade da oferta."}, {"id": "2.15", "texto": "Incentivar a realização de concursos públicos periódicos para profissionais do magistério na educação infantil, assegurada sua inclusão nos planos de carreira do magistério do Município."}, {"id": "2.16", "texto": "Assegurar a todos os profissionais do magistério da rede pública municipal que atuam na educação infantil o piso salarial profissional nacional previsto na legislação federal."}, {"id": "2.17", "texto": "Regulamentar, no prazo de 5 (cinco) anos, exigência de formação mínima em nível médio ou com formação superior, para os profissionais que auxiliam os professores regentes da educação infantil e, para os das redes públicas, incentivar a valorização profissional com organização das carreiras, formação continuada e piso salarial profissional nacional dos profissionais da educação escolar, nos termos de lei federal."}, {"id": "2.18", "texto": "Promover, em regime de colaboração, a formação pedagógica específica dos profissionais que auxiliam os professores regentes da educação infantil na rede pública municipal, de modo a universalizar a formação mínima exigida na legislação até o final da vigência deste PME."}, {"id": "2.19", "texto": "Ampliar e fortalecer as parcerias entre o município e instituições de ensino superior, inclusive núcleos de pesquisa, e demais esferas de governo na oferta de formação continuada dos profissionais do magistério, de modo a incentivar que as práticas pedagógicas dos professores em sala de aula e as práticas coletivas de gestão do trabalho pedagógico incorporem os avanços de pesquisas relacionadas ao processo de ensino-aprendizagem e à melhoria da qualidade da educação infantil."}, {"id": "2.20", "texto": "Ampliar o acesso a recursos pedagógicos diversificados nas creches e pré-escolas, com ênfase no acervo literário, incluindo obras de pequenas editoras para promover a diversidade de produções e o estímulo à leitura, garantida a qualidade das obras selecionadas pelo órgão público competente."}, {"id": "2.21", "texto": "Incentivar práticas diárias de leitura dialogada de obras literárias e de atividades criadoras que envolvam professores e crianças, bem como políticas orientadas para incentivar práticas de leitura dialogada em casa, com o objetivo de promover a aprendizagem e o desenvolvimento integral."}, {"id": "2.22", "texto": "Incentivar o fortalecimento da relação entre escola e família, em especial a participação dos pais ou responsáveis no processo de ensino-aprendizagem e no desenvolvimento integral das crianças, inclusive por meio de iniciativas de apoio ao exercício da parentalidade positiva."}, {"id": "2.23", "texto": "Apoiar, em caráter complementar, programas de orientação às famílias, por meio da articulação das áreas de educação, saúde e assistência social, com foco no desenvolvimento integral das crianças até 5 (cinco) anos de idade."}, {"id": "2.24", "texto": "Promover ações para a integração dos sistemas de dados oficiais, em especial relacio-nados aos beneficiários de programas de transferência de renda, em colaboração intersetorial, para monitoramento do cumprimento do direito à educação da criança e articulação de políticas públicas de proteção à infância."}]}, {"num": 3, "title": "Alfabetização", "objetivo": "Assegurar a alfabetização e o nível adequado de aprendizagem em matemática, ao final do segundo ano do ensino fundamental, a todas as crianças, em todas as modalidades educacionais, com inclusão e redução de desigualdades, visando à sua superação.", "metas": [{"id": "3.a", "texto": "Assegurar que, no mínimo, 80% (oitenta por cento) das crianças estejam alfabetizadas ao final do segundo ano do ensino fundamental, até o quinto ano de vigência deste PME, e que todas as crianças estejam alfabetizadas ao final do segundo ano do ensino fundamental, até o final do decênio."}, {"id": "3.b", "texto": "Assegurar que, no mínimo, 80% (oitenta por cento) das crianças alcancem o nível adequado de aprendizagem em matemática ao final do segundo ano do ensino fundamental, até o quinto ano de vigência deste PME, e que todas as crianças alcancem o nível adequado ao final do segundo ano do ensino fundamental, até o final do decênio."}, {"id": "3.c", "texto": "Reduzir as desigualdades nos resultados de alfabetização e de aprendizagem em mate-mática ao final do segundo ano do ensino fundamental entre grupos sociais, considerando, pelo menos, os definidos por raça/cor, sexo, nível socioeconômico, região e localização, de modo que, até o final da vigência deste PME, a razão dos resultados entre os grupos individualmente considerados seja igual ou superior a 90% (noventa por cento)."}], "estrategias": [{"id": "3.1", "texto": "Estabelecer, em regime de colaboração, mecanismo de governança federativa e pactuação voltado ao cumprimento das metas de alfabetização e de aprendizagem em matemática para todas as crianças, consideradas as desigualdades educacionais existentes e as especificidades das modalidades de ensino."}, {"id": "3.2", "texto": "Estruturar os processos pedagógicos de alfabetização e de ensino de matemática, em articulação com as estratégias desenvolvidas na pré-escola, que envolvam noções relativas a diferentes campos do conhecimento e que ofereçam apoio pedagógico específico, incluídas práticas de codocência e de mentoria, a fim de garantir a alfabetização plena de todas as crianças."}, {"id": "3.3", "texto": "Apoiar a alfabetização de crianças quilombolas, indígenas, do campo, das águas, das florestas e refugiadas e das que integram o público da educação especial, com a produção de materiais didáticos específicos e o desenvolvimento de instrumentos de acompanhamento que considerem as identidades e as especificidades destas populações, garantindo a recomposição das aprendizagens."}, {"id": "3.4", "texto": "Incentivar, quando houver, a alfabetização das crianças indígenas seja realizada, prio-ritariamente, na língua indígena da comunidade, respeitando seus usos linguísticos e projetos pedagógicos próprios."}, {"id": "3.5", "texto": "Participar da revisão, em regime de colaboração, a Base Nacional Comum Curricular (BNCC), conforme ato expedido pelo Conselho Nacional de Educação (CNE), com a finalidade de aperfeiçoar os currículos estaduais e municipais do ensino fundamental, considerados as especificidades dos estudantes e dos territórios e os resultados de avaliação e monitoramento da implementação dos currículos."}, {"id": "3.6", "texto": "Fomentar políticas de valorização para profissionais do magistério em exercício na alfa-betização, com vistas a reconhecer o trabalho do professor alfabetizador e o bom desempenho em sala de aula, asseguradas condições adequadas de trabalho."}, {"id": "3.7", "texto": "Promover políticas de formação inicial, continuada e de desenvolvimento profissional dos professores que atuam nos anos iniciais do ensino fundamental, com vistas ao aperfeiçoamento permanente das práticas pedagógicas e com foco em experiências efetivas para atuar em turmas heterogéneas, multisseriadas, inclusivas e em contextos territoriais, sociais, socioambientais e culturais diversificados, com atenção às crianças quilombolas, indígenas, do campo, migrantes, das águas, das florestas e refugiadas e às que integram o público da educação especial."}, {"id": "3.8", "texto": "Aprimorar e tornar censitários os instrumentos de avaliação da alfabetização e do nível adequado de aprendizagem em matemática, congregando esforços do sistema nacional de ava-liação da educação básica e dos sistemas de avaliação desenvolvidos pela União, Estado e pelo Município, inclusive para turmas multisseriadas, consideradas as especificidades da educação especial e da educação bilíngue de surdos."}, {"id": "3.9", "texto": "Divulgar anualmente, os resultados de aprendizagem e os indicadores educacionais refe-rentes ao segundo ano do ensino fundamental de escolas e rede pública de educação básica do Município, assegurada a contextualização com relação a indicadores sociais relevantes, como os de nível socioeconômico, raça/cor, sexo, região e localização."}, {"id": "3.10", "texto": "Fomentar avaliações diagnósticas e formativas nas unidades educacionais e no sistema de ensino municipal, com o objetivo de definir estratégias para o processo de alfabetização, de ensino da matemática e de recomposição das aprendizagens dos estudantes, incluídos meca-nismos avaliativos contínuos, desde o 1º (primeiro) ano, para acompanhar o progresso de cada criança na leitura, na escrita, na matemática e na fluência de leitura, possibilitando mediações pedagógicas mais imediatas e personalizadas."}, {"id": "3.11", "texto": "Aprimorar os processos de avaliação e a apropriação dos resultados educacionais pelas escolas, considerados os níveis alcançados por diferentes grupos sociais, especialmente os definidos por raça/cor, sexo e nível socioeconômico, com vistas à redução das desigualdades existentes e ao apoio ao planejamento e à gestão."}, {"id": "3.12", "texto": "Promover, em consonância com as diretrizes do Plano Nacional do Livro e Leitura (PNLL), iniciativas escolares estruturadas de formação de leitores e de promoção da leitura e da literatura no ensino fundamental."}, {"id": "3.13", "texto": "Fortalecer a capacidade técnica e administrativa da secretaria de educação para promover o apoio pedagógico e de gestão às escolas, por meio da formação continuada das equipes e de outras ações que visem a qualificar o acompanhamento e a implementação das ações educacionais."}, {"id": "3.14", "texto": "Promover políticas específicas para a alfabetização e para o ensino da matemática volta-das às crianças pertencentes aos grupos de maior vulnerabilidade social, com vistas à superação de desigualdades."}, {"id": "3.15", "texto": "Promover ações e programas de recomposição das aprendizagens, considerando o acom-panhamento contínuo e individualizado dos estudantes."}, {"id": "3.16", "texto": "Disponibilizar materiais didáticos diversificados e adequados às necessidades da alfabe-tização, considerados os componentes curriculares previstos na BNCC para os anos iniciais do ensino fundamental, observando os diferentes contextos e realidades escolares."}]}, {"num": 4, "title": "Acesso, Trajetória e Conclusão no Ensino Fundamental e no Ensino Médio", "objetivo": "Assegurar que crianças, adolescentes e jovens em idade escolar obrigatória concluam o ensino fundamental e o ensino médio na idade regular, em todas as modalidades educacionais, com inclusão e redução de desigualdades, visando à sua superação.", "metas": [{"id": "4.a", "texto": "Universalizar, até o terceiro ano de vigência deste PME, o acesso à escola para toda a população de 6 (seis) a 17 (dezessete) anos de idade."}, {"id": "4.b", "texto": "Garantir que todos os estudantes concluam o quinto ano do ensino fundamental na idade regular."}, {"id": "4.c", "texto": "Garantir que pelo menos 95% (noventa e cinco por cento) dos estudantes concluam o nono ano do ensino fundamental na idade regular, de modo a promover a equidade e a atenção à diversidade populacional, considerando, pelo menos, os grupos sociais definidos por raça/cor, sexo, nível socioeconômico, região e localização."}, {"id": "4.d", "texto": "Garantir que pelo menos 90% (noventa por cento) dos estudantes concluam o ensino médio na idade regular, de modo a promover a equidade e a atenção à diversidade populacional, considerando, pelo menos, os grupos sociais definidos por raça/cor, sexo, nível socioeconômico, região e localização."}], "estrategias": [{"id": "4.1", "texto": "Assegurar padrões nacionais de qualidade do ensino fundamental e do ensino médio, consonantes com as evidências, com enfoque na qualidade da aprendizagem e nas condições de oferta, abrangendo, entre outros, a infraestrutura, inclusive internet de alta velocidade, adequada para uso pedagógico de estudantes e professores, com redes internas de wi-fi; a alimentação; o transporte escolar; os recursos pedagógicos; e os profissionais da educação, respeitado o desenho universal de acessibilidade e consideradas as diversidades territoriais e culturais e as especificidades das modalidades de ensino."}, {"id": "4.2", "texto": "Implementar políticas de construção, reestruturação ou adequação de escolas do ensino fundamental e do ensino médio, e de aquisição de equipamentos, considerando a sustentabilidade socioambiental e com arquitetura inclusiva, especialmente em unidades que atendam estudantes em situação de vulnerabilidade socioeconômica, negros, indígenas, quilombolas, do campo, das águas, das florestas e público da educação especial e em cumprimento de medida socioeducativa, de acordo com as necessidades dos estudantes e com garantia dos padrões nacionais de qualidade."}, {"id": "4.3", "texto": "Ampliar o acesso e assegurar a permanência no ensino fundamental e no ensino médio em tempo integral, garantida a qualidade do ensino, de modo a priorizar o atendimento de crianças e adolescentes em situação de vulnerabilidade socioeconômica, negros, indígenas, quilombolas, do campo, das águas e das florestas, refugiados e público da educação especial."}, {"id": "4.4", "texto": "Assegurar a oferta obrigatória do ensino fundamental, em especial nos anos iniciais, aos estudantes indígenas, quilombolas, do campo, das águas e das florestas nas respectivas comunidades, de forma a atender suas especificidades, condicionadas as ações de nucleação escolar aos resultados de consulta prévia e informada ao respectivo público, assegurando a transparência e o interesse público."}, {"id": "4.5", "texto": "Construir propostas curriculares alinhadas à cidadania, às transformações da sociedade e do mundo do trabalho, e aos saberes comunitários e tradicionais, que assegurem acesso à cultura e ao conhecimento científico, inclusive por meio de programas de iniciação científica, tecnológica e artístico-cultural, com o objetivo de tornar o processo de ensino e aprendizagem contextualizado, atrativo e significativo aos estudantes dos anos finais do ensino fundamental e do ensino médio."}, {"id": "4.6", "texto": "Proporcionar o acompanhamento pedagógico individualizado e o monitoramento da tra-jetória dos estudantes da educação básica, em especial nas transições entre os anos iniciais e finais do ensino fundamental, e entre os anos finais do ensino fundamental e o ensino médio, permitindo a integração de informações entre os diferentes entes federativos, de modo a garantir a aprendizagem e a conclusão da educação básica na idade regular."}, {"id": "4.7", "texto": "Adaptar, no âmbito dos sistemas de ensino, o currículo e o calendário escolar, de acordo com a realidade, a identidade cultural, as condições climáticas da região e as necessidades dos estudantes, garantindo a participação da comunidade escolar, e considerando a valorização das culturas locais e dos saberes comunitários e tradicionais, com o objetivo de promover a trajetória regular."}, {"id": "4.8", "texto": "Fomentar políticas de apoio à permanência, incluindo incentivo financeiro-educacional aos estudantes, tal como previsto na Lei nº 14.818, de 16 de janeiro de 2024, com o objetivo de garantir a trajetória escolar regular de estudantes em situação de vulnerabilidade socioeconômica nos anos finais do ensino fundamental e no ensino médio."}, {"id": "4.9", "texto": "Fortalecer a articulação entre a educação básica e a educação profissional e tecnológica, de modo a fomentar a expansão das matrículas gratuitas de ensino médio na forma articulada à educação profissional, inclusive ampliando a oferta em período noturno, quando necessário."}, {"id": "4.10", "texto": "Promover a busca ativa de crianças e adolescentes fora da escola, em parceria com órgãos públicos de assistência social, saúde e proteção à infância, à adolescência e à juventude, entre outros, implementando políticas públicas intersetoriais, mediante a integração entre os sistemas de informação educacionais e sociais, com compartilhamento de dados entre as diferentes esferas de governo."}, {"id": "4.11", "texto": "Ampliar os espaços de participação das comunidades escolares, em especial dos estu-dantes, no desenvolvimento de atividades curriculares, culturais e esportivas dentro e fora dos espaços escolares."}, {"id": "4.12", "texto": "Implementar, em articulação intersetorial, políticas de prevenção à evasão e ao abandono escolar, motivados por preconceito ou quaisquer formas de discriminação, dentro e fora da escola, com a criação de redes de proteção que incluam famílias e órgãos públicos de assistência social, saúde e proteção à infância, à adolescência e à juventude."}, {"id": "4.13", "texto": "Implementar, nas instituições educacionais, programas de promoção da cultura de paz e de prevenção e combate às diversas formas de violência previstas nas Leis nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), nº 13.185, de 6 de novembro de 2015, e nº 13.431, de 4 de abril de 2017."}, {"id": "4.14", "texto": "Desenvolver e implementar programas e ações que fortaleçam a articulação entre escolas e famílias ao longo de toda a educação básica e incentivem processos de integração dos pais ou responsáveis na vida escolar dos estudantes e no apoio ao seu desenvolvimento integral."}, {"id": "4.15", "texto": "Estimular e ampliar programas de iniciação científica, tecnológica e artístico-cultural nas redes públicas e privadas da educação básica, por meio de parcerias com instituições de ensino superior, centros de pesquisa e setor produtivo, visando promover a cultura da investigação, o desenvolvimento de competências científicas, tecnológicas e artísticas e a integração entre educação básica, cultura e pesquisa."}, {"id": "4.16", "texto": "Assegurar o acesso, a permanência e a conclusão da educação básica obrigatória para adolescentes e jovens em cumprimento de medida socioeducativa, sem a imposição de qualquer forma de constrangimento, preconceito ou discriminação, com atenção à continuidade da traje-tória escolar na escola de origem ou localizada no território, quando possível, a fim de promover a convivência comunitária."}]}, {"num": 5, "title": "Aprendizagem no Ensino Fundamental e no Ensino Médio", "objetivo": "Garantir a aprendizagem dos estudantes no ensino fundamental e no ensino médio, em todas as modalidades educacionais, com inclusão e redução de desigualdades, visando à sua superação.", "metas": [{"id": "5.a", "texto": "Assegurar que 100% (cem por cento) dos estudantes, ao término dos anos iniciais do ensino fundamental, alcancem o nível básico de aprendizagem, com pelo menos 70% (setenta por cento) deles no nível adequado de aprendizagem, até o quinto ano de vigência deste PME, e 90% (noventa por cento) deles no nível adequado de aprendizagem, até o final do decênio."}, {"id": "5.b", "texto": "Assegurar que 100% (cem por cento) dos estudantes, ao término dos anos finais do ensino fundamental, alcancem o nível básico de aprendizagem, com pelo menos 60% (sessenta por cento) deles no nível adequado de aprendizagem, até o quinto ano de vigência deste PME, e 85% (oitenta e cinco por cento) deles no nível adequado de aprendizagem, até o final do decênio."}, {"id": "5.c", "texto": "Reduzir as desigualdades de aprendizagem no ensino fundamental entre grupos sociais, considerando, pelo menos os definidos por raça/cor, sexo, nível socioeconômico, região e localização, de modo que, até o final da vigência deste PME, a razão dos resultados entre os grupos individualmente considerados seja igual ou superior a 90% (noventa por cento)."}, {"id": "5.d", "texto": "Assegurar que 100% (cem por cento) dos estudantes, ao término do ensino médio, alcancem o nível básico de aprendizagem, com pelo menos 50% (cinquenta por cento) deles no nível adequado de aprendizagem, até o quinto ano de vigência deste PME, e 80% (oitenta por cento) deles no nível adequado de aprendizagem, até o final do decênio."}, {"id": "5.e", "texto": "Reduzir as desigualdades de aprendizagem no ensino médio entre grupos sociais, consi-derando, pelo menos os definidos por raça/cor, sexo, nível socioeconômico, região e localização, de modo que, até o fim da vigência deste PME, a razão dos resultados entre os grupos individu-almente considerados seja igual ou superior a 90% (noventa por cento)."}, {"id": "5.f", "texto": "Reduzir progressivamente os índices de violência no ambiente escolar contra profissi-onais da educação e estudantes, incluídas as ocorrências de intimidação sistemática (bullying) previstas na Lei nº 13.185, de 6 de novembro de 2015, observados, entre outros, os mapeamen-tos produzidos pelo Sistema Nacional de Acompanhamento e Combate à violência nas Escolas (Snave), conforme disposto na Lei nº 14.643, de 2 de agosto de 2023."}], "estrategias": [{"id": "5.1", "texto": "Apoiar a revisão a BNCC a partir de proposta a ser elaborada pelo Ministério da Edu-cação, em regime de colaboração, e encaminhada ao Conselho Nacional de Educação (CNE) após consulta pública, a fim de aperfeiçoar os currículos do ensino fundamental e do ensino médio, bem como os materiais didáticos que apoiam sua implementação, consideradas as espe-cificidades dos estudantes e dos territórios, além dos resultados de avaliação e monitoramento da implementação dos currículos."}, {"id": "5.2", "texto": "Apoiar a institucionalização da política nacional do ensino médio que incentive práticas pedagógicas com abordagens interdisciplinares, em atenção aos regramentos estabelecidos na Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), aos princípios e direitos de aprendizagem da BNCC, às partes diversificadas instituídas no âmbito de cada sistema de ensino, às especificidades das modalidades de ensino e das identidades, culturas e saberes das diferentes comunidades e povos, e às necessidades e expectativas de desenvolvimento dos estudantes, auxiliando-os na construção de seu projeto de vida e garantindo-lhes igualdade de condições para o acesso aos estudos na educação superior ou na educação profissional e tecnológica, ou o ingresso no mundo do trabalho."}, {"id": "5.3", "texto": "Assegurar a implementação das diretrizes curriculares de Educação para as Relações Étnico-raciais, nos termos das Leis nº 10.639, de 9 de janeiro de 2003, e nº 11.645, de 10 de março de 2008, da Educação em Direitos Humanos e da Educação Ambiental, em consonância com as abordagens dos temas transversais da BNCC."}, {"id": "5.4", "texto": "Apoiar a aprendizagem de estudantes indígenas, quilombolas, do campo, das águas e das florestas, jovens e adultos, e do público da educação especial e da educação bilíngue de surdos, com a produção de materiais didáticos específicos e o desenvolvimento de instrumentos de acompanhamento que considerem as identidades e especificidades dessas comunidades."}, {"id": "5.5", "texto": "Aprimorar e tornar censitários os instrumentos nacionais de avaliação da qualidade do ensino fundamental e do ensino médio, inclusive para turmas multisseriadas, de modo a ampliar os componentes curriculares e etapas avaliados, consideradas as especificidades do público da educação especial e da educação bilíngue de surdos."}, {"id": "5.6", "texto": "Acompanhar a aplicação de avaliações internacionalmente reconhecidas, tais como o Programa Internacional de Avaliação de Estudantes (Pisa), o Estudo Regional Comparativo e Explicativo (Erce), o Estudo Internacional de Tendências em Matemática e Ciências (TIMSS) e o Estudo Internacional de Progresso em Leitura (PIRLS), além da divulgação de resultados agregados por unidades da Federação, a fim de que se possa observar a avaliação da aprendizagem dos estudantes brasileiros em comparação com outros países."}, {"id": "5.7", "texto": "Induzir a participação de pelo menos 80% (oitenta por cento) dos estudantes de cada ano escolar periodicamente avaliado em cada rede de ensino do município de Rosário do Catete por meio dos exames do sistema nacional, estadual e municipal de avaliação da educação básica."}, {"id": "5.8", "texto": "Divulgar bienalmente os resultados de aprendizagem e os indicadores educacionais do Sistema de Avaliação da Educação Básica (Saeb), e anualmente os indicadores oriundos do Índice de Desempenho Escolar de Sergipe (Idese) relativos às escolas, às redes públicas de educação básica e aos sistemas de ensino, assegurada a contextualização de indicadores sociais relevantes, como os de nível socioeconômico, raça/cor, sexo, região e localização."}, {"id": "5.9", "texto": "Monitorar o índice para avaliação da qualidade com equidade da educação básica que agregue indicadores como desempenho e fluxo escolar, em integração com os demais parâmetros previstos pelo sistema nacional de avaliação da educação básica."}, {"id": "5.10", "texto": "Aperfeiçoar os processos de avaliação nacionais, sua articulação com os internacionais, e a apropriação dos resultados educacionais pelas escolas, considerados os níveis alcançados por diferentes grupos sociais, visando a redução das desigualdades existentes e o apoio ao planejamento e à gestão."}, {"id": "5.11", "texto": "Fomentar avaliações diagnósticas e formativas nas unidades educacionais e nos sistemas de ensino em todos os anos do ensino fundamental e do ensino médio, bem como processos contínuos de avaliação institucional e autoavaliação que envolvam a comunidade escolar, com o objetivo de definir estratégias para o desenvolvimento e a recomposição das aprendizagens dos estudantes, e de subsidiar políticas públicas educacionais."}, {"id": "5.12", "texto": "Acompanhar estudantes com rendimento escolar defasado, de forma a ofertar práticas pedagógicas que contribuam para a recomposição de aprendizagens."}, {"id": "5.13", "texto": "Instituir mecanismos de acompanhamento individualizado de estudantes, com especial atenção às transições entre as etapas da educação básica, utilizando-se de instrumentos diag-nósticos, e políticas educacionais com vistas à redução das desigualdades de aprendizagem, em especial para estudantes em vulnerabilidade socioeconômica, em cumprimento de medidas socioeducativas, negros, indígenas, quilombolas, do campo, público da educação especial e que estejam passando ou tenham passado por processo de violência física ou psicológica."}, {"id": "5.14", "texto": "Promover políticas de formação inicial e continuada dos professores, com vistas ao aumento da proporção de docentes com formação adequada à área de conhecimento e modalidade que lecionam e ao aperfeiçoamento permanente das práticas pedagógicas, com foco nos desafios dos anos finais do ensino fundamental e do ensino médio."}, {"id": "5.15", "texto": "Promover políticas de formação inicial e continuada de professores e gestores escolares com foco em experiências pedagógicas efetivas, que estimulem uma cultura escolar de melhoria contínua da aprendizagem de todos os estudantes e que possibilitem aos docentes atuar em turmas heterogêneas, multisseriadas e inclusivas, em escolas com contextos territoriais, sociais, socioambientais e culturais diversificados."}, {"id": "5.16", "texto": "Incentivar a adoção de medidas para favorecer a alocação de profissionais do magistério experientes e qualificados em escolas localizadas em contexto de vulnerabilidade socioeconô-mica."}, {"id": "5.17", "texto": "Fortalecer a capacidade técnica, administrativa e de gestão financeira da secretaria de educação para promover o apoio pedagógico e de gestão às escolas."}, {"id": "5.18", "texto": "Disponibilizar sistema multidimensional de gestão escolar que viabilize apoio técnico e financeiro, de modo a fortalecer o processo de investigação e planejamento com foco na aprendizagem, assim como o efetivo desenvolvimento da gestão pedagógica."}, {"id": "5.19", "texto": "Estimular políticas públicas orientadas ao fortalecimento da relação escola-família, em especial à participação dos pais ou responsáveis no desenvolvimento das atividades escolares dos estudantes, com vistas à melhoria do clima, da convivência escolar e da aprendizagem, inclusive por meio de iniciativas de promoção do exercício da parentalidade positiva."}, {"id": "5.20", "texto": "Promover a articulação das políticas e dos programas de educação, de âmbito local, regional e nacional, com saúde, trabalho e emprego, assistência social, esporte e cultura, e demais instituições do Sistema de Garantia de Direitos da Criança e do Adolescente (SGDCA), de modo a possibilitar a criação de rede de apoio integral aos estudantes e às suas famílias."}, {"id": "5.21", "texto": "Promover, em consonância com as diretrizes do PNLL, iniciativas escolares estruturadas de formação de leitores no ensino fundamental e no ensino médio, inclusive por meio da quali-ficação docente para diagnosticar níveis de fluência em leitura e implementar ações específicas para auxiliar estudantes com dificuldades."}, {"id": "5.22", "texto": "Aprimorar os processos de elaboração e de seleção de materiais didáticos e paradidáticos disponibilizados aos estudantes da educação básica, assegurando a qualidade de seu conteúdo, referenciado cientificamente, e prevenindo a disseminação de erros factuais."}, {"id": "5.23", "texto": "Ampliar as possibilidades de participação social e o acesso a oportunidades educacionais e profissionais em um contexto de internacionalização, por meio do fortalecimento do ensino de línguas estrangeiras, principalmente a inglesa e a espanhola, com a disponibilização dos recursos necessários ao processo de ensino-aprendizagem, e com ênfase no desenvolvimento de competências comunicativas e interculturais."}, {"id": "5.24", "texto": "Desenvolver e implementar, em articulação intersetorial, programas e ações de prevenção às diversas formas de violência no ambiente escolar e de promoção da cultura de paz, com foco no desenvolvimento de habilidades socioemocionais, práticas restaurativas, mediação de conflitos e criação de ambientes escolares seguros, acolhedores, inclusivos e estimulantes para a aprendizagem."}, {"id": "5.25", "texto": "Qualificar as equipes escolares para identificar, intervir e prevenir casos de intimidação sistemática (bullying e cyberbullying), fortalecendo os protocolos de acolhimento e proteção às vítimas e de responsabilização dos agressores, em consonância com a legislação vigente e com foco na aprendizagem e no desenvolvimento integral."}, {"id": "5.26", "texto": "Apoiar a implementação da Política Nacional de Atenção Psicossocial nas Comunidades Escolares e a presença das equipes multiprofissionais nas redes públicas de educação básica, com vistas a promover a articulação das áreas de educação, saúde e assistência social no desen-volvimento de ações voltadas à atenção psicossocial nas comunidades escolares e à melhoria da qualidade do processo de ensino-aprendizagem."}]}]}, {"gt": "GT 2", "desc": "Eixo I.b – Metas 6, 7, 11, 12 e 13", "metas": [{"num": 6, "title": "Educação Integral em Tempo Integral", "objetivo": "Ampliar a oferta de educação integral em tempo integral para a rede pública, assegurando sua qualidade e a intencionalidade pedagógica das atividades.", "metas": [{"id": "6.a", "texto": "Garantir a oferta de matrículas em tempo integral, na perspectiva da educação integral, com jornada mínima de 7 (sete) horas diárias ou 35 (trinta e cinco) horas semanais, preferen-cialmente em turno único, em, no mínimo, 50% (cinquenta por cento) das escolas públicas, de forma a atender, pelo menos, 35% (trinta e cinco por cento) dos estudantes da educação básica até o quinto ano de vigência deste PME, e em, no mínimo, 65% (sessenta e cinco por cento) das escolas públicas, de forma a atender, pelo menos, 50% (cinquenta por cento) dos estudantes da educação básica até o final da vigência deste PME."}], "estrategias": [{"id": "6.1", "texto": "Instituir a política municipal para ampliação da oferta e da qualidade da educação integral em jornada escolar em tempo integral com, no mínimo, 7 (sete) horas diárias ou 35 (trinta e cinco) horas semanais, nas diferentes etapas e modalidades da educação básica, com a garantia de condições adequadas de infraestrutura, de profissionais da educação, de alimentação, de transporte escolar e de recursos didático-pedagógicos."}, {"id": "6.2", "texto": "Implementar, em regime de colaboração, diretrizes operacionais nacionais de jornada escolar em tempo integral, com mecanismos de monitoramento e avaliação de sua implementa-ção, que garanta a qualidade e a intencionalidade pedagógica de todas as ações realizadas nesse âmbito, respeitadas as especificidades das etapas e das modalidades, para orientar a construção de documentos curriculares pelos entes federativos que garantam os direitos de aprendizagem e de desenvolvimento pleno com base em abordagem multidisciplinar e intersetorial e promovam a formação para a cidadania e a qualificação para o trabalho dos estudantes."}, {"id": "6.3", "texto": "Otimizar e promover o efetivo aproveitamento do tempo de permanência na escola du-rante jornada expandida, com o objetivo de alcançar o desenvolvimento integral dos estudantes, por meio da mobilização e integração entre diferentes espaços, instituições sociais e tempos educativos e da diversificação das experiências e interações sociais, de maneira a unir, com intencionalidade pedagógica, atividades acadêmicas, científicas, tecnológicas, de reforço e re-composição de aprendizagem, recreativas, esportivas, artísticas e culturais."}, {"id": "6.4", "texto": "Apoiar as políticas de assistência e de incentivo financeiro-educacional - tal como previsto na Lei nº 14.818, de 16 de janeiro de 2024 - aos estudantes matriculados em jornada de tempo integral, incluída a concessão de bolsas de monitoria por desempenho escolar, especialmente aos estudantes do ensino médio em situação de vulnerabilidade socioeconômica, a fim de garantir o acesso, a permanência e a conclusão dos estudos com qualidade e equidade."}, {"id": "6.5", "texto": "Fomentar a ampliação das matrículas em jornada de tempo integral para estudantes em situação de vulnerabilidade socioeconômica, com defasagem idade-série, negros, indígenas, quilombolas e do campo e para o público da educação especial, consideradas as necessidades e as especificidades de cada grupo."}, {"id": "6.6", "texto": "Instituir, em regime de colaboração, programas para a construção, a ampliação e a reestru-turação das escolas públicas, por meio da instalação de quadras poliesportivas, preferencialmente cobertas, com equipamentos e materiais adequados para práticas esportivas e corporais, jogos e brincadeiras, de laboratórios, inclusive de informática, espaços para atividades culturais, bibli-otecas com acervo atualizado e diversificado, auditórios, cozinhas, refeitórios, banheiros, com saneamento básico, acesso à água potável e à energia elétrica, mobiliários e outros equipamen-tos que visem garantir uma proposta pedagógica que promova o desenvolvimento integral dos estudantes, respeitado o desenho universal de acessibilidade e consideradas suas necessidades e características, prioritariamente em escolas que atendam estudantes em situação de vulnera-bilidade socioeconômica, negros, indígenas, quilombolas e do campo e o público da educação especial."}, {"id": "6.7", "texto": "Garantir, nos currículos de educação integral em tempo integral, a inclusão das áreas e dos temas transversais previstos na Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), na BNCC e em demais normas curriculares dos sistemas de ensino, e fomentar sua implementação, com o objetivo de valorizar a sustentabilidade socioambiental, o exercício pleno da cidadania de todos os indivíduos e de grupos sociais, seus saberes e suas identidades culturais e a pluralidade de cosmovisões, culturas e potencialidades, sem discriminação de qualquer natureza."}, {"id": "6.8", "texto": "Promover a participação da comunidade escolar, de acordo com os princípios de gestão democrática, incluindo o fortalecimento da organização estudantil nas suas variadas formas, na construção de documentos curriculares e propostas pedagógicas da educação integral em tempo integral contextualizados às suas realidades territoriais e culturais."}, {"id": "6.9", "texto": "Fortalecer a formação inicial e continuada de profissionais da educação, com base na perspectiva da educação integral, induzindo abordagens práticas e baseadas em evidências científicas, com o objetivo de assegurar os direitos de aprendizagens e o desenvolvimento pleno aos estudantes em jornada de tempo integral."}, {"id": "6.10", "texto": "Instituir políticas com vistas a fortalecer a capacidade de planejamento e gestão peda-gógica integrados entre a secretaria de educação e unidades educacionais para a integração e o desenvolvimento dos currículos e projetos político-pedagógicos para a educação integral."}, {"id": "6.11", "texto": "Fomentar, na educação integral em tempo integral do ensino médio, estratégias voltadas para a permanência escolar e o desenvolvimento do projeto de vida dos estudantes dessa etapa, com vistas à entrada no mundo do trabalho em suas múltiplas dimensões, ao acesso e à conti-nuidade dos estudos na educação superior e na educação profissional e tecnológica, à promoção do empreendedorismo e à participação em intercâmbios culturais e em olimpíadas e feiras de conhecimento e científicas."}, {"id": "6.12", "texto": "Fortalecer a prática do esporte educacional e da educação física, de forma integrada e articulada transversalmente às demais áreas do conhecimento e às políticas intersetoriais, con-tribuindo para a aprendizagem, a permanência escolar, a motivação, a redução de desigualdades e o desenvolvimento integral dos estudantes."}, {"id": "6.13", "texto": "Desenvolver, em regime de colaboração, indicadores e instrumentos de acompanhamento da qualidade da educação integral em tempo integral e instituir mecanismo nacional para sua implementação e monitoramento, com foco no suporte técnico, na formação e na avaliação das políticas junto aos entes federativos, considerando não apenas a ampliação da jornada, mas também a intencionalidade pedagógica, a integração curricular, o bem-estar e o engajamento dos estudantes."}, {"id": "6.14", "texto": "Estimular a expansão equilibrada das matrículas em tempo integral entre as regiões e as diferentes etapas da educação básica."}]}, {"num": 7, "title": "Educação Digital e Tecnologias de Informação e Comunicação (TDICs)", "objetivo": "Promover a educação digital com a garantia de conectividade de alta velocidade para fins pedagógicos, inclusive com redes internas wi-fi, e dos conteúdos das 3 (três) dimensões esta-belecidas na Base Nacional Comum Curricular (BNCC) - pensamento computacional, mundo digital e cultura digital -, para aprendizagem das suas competências e habilidades de forma se-gura, responsável, ética, crítica e criativa, e a integração das Tecnologias Digitais de Informação e Comunicação (TDlCs) à educação, para melhoria da aprendizagem, equidade e inclusão.", "metas": [{"id": "7.a", "texto": "Assegurar a conectividade à internet de alta velocidade adequada para uso pedagógico de estudantes e professores, inclusive com redes internas wi-fi, em 50% (cinquenta por cento) das escolas públicas da educação básica até o segundo ano de vigência deste PME, em 75% (setenta e cinco por cento) ao final do quinto ano, e em todas as escolas públicas da educação básica até o final do decênio."}, {"id": "7.b", "texto": "Assegurar que todos os estudantes alcancem o nível básico de aprendizagem em cada uma das 3 (três) dimensões estabelecidas na BNCC para a educação digital - pensamento computacional, mundo digital e cultura digital -, com pelo menos 50% (cinquenta por cento), 45% (quarenta e cinco por cento) e 40% (quarenta por cento) dos estudantes no nível adequado de aprendizagem, respectivamente ao término dos anos iniciais do ensino fundamental, dos anos finais do ensino fundamental e do ensino médio, até o quinto ano de vigência deste PME; e 80% (oitenta por cento) dos estudantes, ao término dos 3 (três) marcos referidos anteriormente nesta meta, até o final do decênio."}], "estrategias": [{"id": "7.1", "texto": "Acompanhar a política nacional de inclusão digital, com garantia de oferta de conectivi-dade à internet de alta velocidade, adequada para uso pedagógico de estudantes e professores, inclusive com redes internas wi-fi, com infraestrutura e equipamentos para uso adequado de TDlCs e soluções digitais, para todas as escolas públicas."}, {"id": "7.2", "texto": "Selecionar, certificar, divulgar e incentivar o desenvolvimento de soluções digitais e TDlCs, em especial para estudantes em situação de vulnerabilidade socioeconômica e público da educação especial, preferencialmente como recursos educacionais digitais nacionais, abertos ou livres, asseguradas a diversidade e a qualidade de métodos e propostas pedagógicas, em todas as etapas e modalidades da educação básica, com o propósito de garantir a aprendizagem efetiva dos estudantes."}, {"id": "7.3", "texto": "Estabelecer, em regime de colaboração, parâmetros mínimos de quantidade e qualidade dos equipamentos e dispositivos tecnológicos adequados à finalidade pedagógica da educação digital, nas 3 (três) dimensões estabelecidas pela BNCC - pensamento computacional, mundo digital e cultura digital -, para uso dos estudantes e professores."}, {"id": "7.4", "texto": "Assegurar, em regime de colaboração, a aquisição e a disponibilização de dispositivos tecnológicos que favoreçam a aprendizagem e o desenvolvimento das competências e habilidades relacionadas à educação digital definidas na BNCC, por parte dos professores e dos estudantes, nas escolas com velocidade de conexão à internet adequada ao uso pedagógico e com projeto de integração das TDlCs."}, {"id": "7.5", "texto": "Disponibilizar TDlCs e soluções digitais que combinem, de maneira articulada, a orga-nização do tempo e das atividades didáticas na escola, considerados os contextos locais, as desigualdades de raça/cor, o nível socioeconômico, o sexo e a região, e as especificidades da educação especial, da educação bilíngue de surdos, da educação do campo, da educação de jo-vens e adultos, da educação escolar indígena e da educação escolar quilombola, inclusive a dos estudantes do sistema socioeducativo e prisional, e dos estudantes internados para tratamento de saúde em regime hospitalar ou domiciliar por tempo prolongado, de modo a favorecer a equidade de oportunidades de uso de tecnologias digitais no processo de ensino e aprendizagem."}, {"id": "7.6", "texto": "Induzir e disseminar a adoção de currículos voltados para a educação digital, nas 3 (três) dimensões previstas na BNCC - pensamento computacional, mundo digital e cultura digital -, conforme diretrizes do Conselho Nacional de Educação (CNE)."}, {"id": "7.7", "texto": "Acompanhar a atualização da BNCC para observar a inclusão dos temas relacionados à inteligência artificial, ao uso saudável das TDlCs e aos impactos negativos do uso prolongado de celulares, redes sociais e jogos eletrônicos, na saúde mental e na aprendizagem."}, {"id": "7.8", "texto": "Implementar estratégias pedagógicas para o desenvolvimento da educação digital e midi-ática, nas 3 (três) dimensões previstas na BNCC - pensamento computacional, mundo digital e cultura digital -, inclusive o uso seguro, responsável e equilibrado das TDlCs."}, {"id": "7.9", "texto": "Assegurar a oferta de material didático, preferencialmente por meio do Programa Nacio-nal do Livro e do Material Didático (PNLD), para o ensino e a aprendizagem das competências e habilidades relacionadas à educação digital, nas 3 (três) dimensões previstas na BNCC - pensamento computacional, mundo digital e cultura digital - para todas as etapas da educação básica e garantir a disponibilização de recursos educacionais digitais, preferencialmente naci-onais, abertos ou livres, que favoreçam a aprendizagem dos estudantes em todas as áreas do conhecimento."}, {"id": "7.10", "texto": "Promover e estimular a formação inicial e continuada de professores da educação básica para a integração, de forma segura, responsável, ética, crítica e criativa, das TDlCs ao processo de ensino e aprendizagem e para a implementação da educação digital nas 3 (três) dimensões previstas na BNCC - pensamento computacional, mundo digital e cultura digital."}, {"id": "7.11", "texto": "Promover e estimular a formação inicial e continuada de profissionais da educação básica para a integração das TDlCs aos processos educacionais, inclusive quanto ao uso de recursos educacionais digitais abertos e à proteção de dados."}, {"id": "7.12", "texto": "Estruturar e aplicar, aos discentes, a cada 2 (dois) anos, a avaliação das competências e habilidades relacionadas à educação digital, considerando as 3 (três) dimensões previstas na BNCC - pensamento computacional, mundo digital e cultura digital - em todas as etapas da educação básica, abrangendo tanto a implementação transversal quanto a específica do currículo de educação digital."}, {"id": "7.13", "texto": "Fomentar o desenvolvimento de soluções digitais - preferencialmente públicas, livres ou abertas -, com transparência e proteção de dados, para auxiliar as práticas de correção de fluxo, o acompanhamento pedagógico individualizado e a recomposição das aprendizagens."}, {"id": "7.14", "texto": "Assegurar a oferta de soluções digitais - preferencialmente públicas, livres ou abertas -, definidas a partir de diretrizes nacionais, para apoiar uma gestão mais eficiente da secretaria e escolas, de forma a integrar dados e a garantir a interoperabilidade de sistemas em regime de colaboração, inclusive para a gestão, pelas próprias escolas, dos dados sobre os resultados edu-cacionais, com transparência pública e atenção à proteção de dados pessoais, em conformidade com a Lei nº 13.709, de 14 de agosto de 2018 (Lei Geral de Proteção de Dados Pessoais)."}, {"id": "7.15", "texto": "Fomentar a parceria da escola com as famílias para a promoção do uso seguro, respon-sável, ético, crítico, criativo e equilibrado das tecnologias digitais, a fim de prevenir os efeitos adversos do uso excessivo das TDlCs e os riscos à saúde mental de crianças e adolescentes."}, {"id": "7.16", "texto": "Assegurar processo de seleção e avaliação de TDlCs e soluções digitais, com parâmetros de segurança e proteção de dados, que garanta aquisição de ferramentas não discriminatórias e com evidências de impacto positivo na aprendizagem da educação digital."}, {"id": "7.17", "texto": "Estabelecer diretrizes para o uso sustentável de dispositivos tecnológicos no ambiente escolar, com orientações sobre a gestão responsável do ciclo de vida dos equipamentos, a adoção de práticas de logística reversa e o descarte adequado de resíduos eletrônicos."}, {"id": "7.18", "texto": "Assegurar, no prazo de 2 (dois) anos, contado da data de publicação desta Lei, a criação, pelo CNE, de diretrizes nacionais para a adoção e o uso de plataformas educacionais digitais e de inteligência artificial na educação, garantindo-se fins pedagógicos e critérios de transparência e proteção de dados, conforme a Lei nº 13.709, de 14 de agosto de 2018 (Lei Geral de Proteção de Dados Pessoais), e a Lei nº 15.211, de 17 de setembro de 2025 (Estatuto Digital da Criança e do Adolescente)."}, {"id": "7.19", "texto": "Fomentar a produção de soluções digitais, preferencialmente públicas, livres e abertas, para a educação básica, por meio de parcerias das Instituições Científica, Tecnológica e de Inovação (ICTs), previstas na Lei nº 10.973, de 2 de dezembro de 2004, com a rede pública de ensino."}, {"id": "7.20", "texto": "Utilizar, em até 3 (três) anos, a definição pelo Inep dos níveis e padrões de aprendizagem, bem como dos indicadores de desempenho escolar, para cada uma das 3 (três) dimensões da educação digital estabelecidas na BNCC - pensamento computacional, mundo digital e cultura digital -, com vistas ao monitoramento da Meta 7.b e à inclusão da educação digital na avaliação nacional da educação básica."}]}, {"num": 11, "title": "Educação de Jovens, Adultos e Idosos", "objetivo": "Assegurar a alfabetização e ampliar o acesso, a permanência e a conclusão da educação básica de todos os jovens, adultos e idosos.", "metas": [{"id": "11.a", "texto": "Elevar a taxa de alfabetização da população com 15 (quinze) anos ou mais para 97% (noventa e sete por cento) até o quinto ano de vigência deste PME e superar o analfabetismo até o final do decênio."}, {"id": "11.b", "texto": "Elevar para 85% (oitenta e cinco por cento) o percentual da população com 15 (quinze) anos ou mais que concluiu o ensino fundamental e universalizar essa etapa para a população de 15 (quinze) a 29 (vinte e nove) anos."}, {"id": "11.c", "texto": "Elevar para 75% (setenta e cinco por cento) o percentual da população com 18 (dezoito) anos ou mais que concluiu o ensino médio e universalizar essa etapa para a população de 18 (dezoito) a 29 (vinte e nove) anos."}, {"id": "11.d", "texto": "Expandir as matrículas na educação de jovens e adultos, de modo a atender, no mínimo, 10% (dez por cento) da população com 18 (dezoito) anos ou mais que não concluiu a educação básica até o quinto ano de vigência deste PME e 20% (vinte por cento) até o final do decênio."}, {"id": "11.e", "texto": "Garantir, a oferta da educação de jovens e adultos, para atender, até o quinto ano de vigência deste PME, 100% (cem por cento) da demanda por vagas, asseguradas a chamada pública e a busca ativa de jovens, adultos e idosos que não concluíram a educação básica."}], "estrategias": [{"id": "11.1", "texto": "Instituir, em regime de colaboração, política municipal de educação de jovens, adultos e idosos, de forma a promover a continuidade e a conclusão dos estudos na educação básica, na modalidade da educação de jovens e adultos (EJA)."}, {"id": "11.2", "texto": "Garantir a oferta gratuita da EJA a todos os que não tenham acessado ou concluído a educação básica na idade recomendada, em todos os turnos, observadas as diretrizes do CNE e do sistema municipal de educação."}, {"id": "11.3", "texto": "Realizar de forma regular e intersetorial o levantamento e o mapeamento de demanda por vagas na EJA, observadas as especificidades e as necessidades educativas do estudante e considerado o perfil da comunidade local, com o objetivo de orientar a formulação e a implementação da política educacional no território."}, {"id": "11.4", "texto": "Manter a política de apoio à permanência na EJA, conforme previsto na legislação muni-cipal, especialmente na Lei nº 1.043, de 6 de março de 2026, por meio de incentivos financeiros educacionais aos estudantes em situação de vulnerabilidade socioeconômica matriculados em instituições públicas."}, {"id": "11.5", "texto": "Instituir mecanismos e incentivos que integrem os segmentos empregadores, públicos e privados, e os sistemas de ensino, para promover a compatibilização da jornada de trabalho dos estudantes trabalhadores com a oferta da EJA."}, {"id": "11.6", "texto": "Fomentar a oferta da EJA articulada à educação profissional e tecnológica, com os objetivos de garantir a qualidade da educação e de ampliar o acesso dos estudantes ao mundo do trabalho, além de promover o pleno desenvolvimento da pessoa e seu preparo para o exercício da cidadania."}, {"id": "11.7", "texto": "Implementar ações de atendimento ao estudante por meio de programas suplementares de transporte, alimentação e saúde, com o objetivo de garantir a permanência na modalidade da educação de jovens e adultos."}, {"id": "11.8", "texto": "Promover, nos casos em que as necessidades e as especificidades dos estudantes assim o exigirem, a oferta gratuita de turmas da modalidade da EJA em espaços não escolares, asseguradas as condições pedagógicas e estruturais adequadas."}, {"id": "11.9", "texto": "Realizar de forma contínua a chamada pública por meio de diferentes estratégias e canais de comunicação, com registro de demanda."}, {"id": "11.10", "texto": "Realizar de forma regular e intersetorial a busca ativa de jovens, adultos e idosos que não concluíram a educação básica, com os objetivos de fazer o levantamento da demanda por vagas na EJA e de garantir o acesso à modalidade em todo o município."}, {"id": "11.11", "texto": "Realizar, em regime de colaboração, campanhas anuais de comunicação para estimular e convencer jovens, adultos e idosos que não concluíram a educação básica a exercerem seu direito ao acesso e à conclusão desse nível de ensino por meio da EJA."}, {"id": "11.12", "texto": "Instituir instâncias de articulação, com o objetivo de garantir a oferta de todas as etapas da educação de jovens e adultos, considerada a diversidade de público: pessoas em vulnerabilidade socioeconômica, negras, indígenas, quilombolas, do campo, das águas, das florestas, residentes em áreas de assentamento, do sistema socioeducativo e prisional e refugiadas e o público da educação especial."}, {"id": "11.13", "texto": "Estruturar, com a participação da comunidade escolar, currículos, projetos pedagógicos e práticas pedagógicas condizentes com as especificidades dos estudantes da modalidade da educação de jovens e adultos, observadas as singularidades das populações atendidas, com o objetivo de garantir a qualidade da educação e a permanência na escola."}, {"id": "11.14", "texto": "Por meio de regime de colaboração, participar da avaliação nacional de todas as etapas da educação de jovens e adultos, de modo a subsidiar a formulação, o acompanhamento e o aprimoramento das políticas públicas voltadas à modalidade."}, {"id": "11.15", "texto": "Implementar políticas de formação continuada de profissionais da educação que atuem na modalidade da educação de jovens e adultos, em especial por meio de parcerias com institu-ições de ensino superior e de educação profissional e tecnológica públicas, com o objetivo de garantir a qualidade da educação."}, {"id": "11.16", "texto": "Assegurar que as necessidades, os interesses e os saberes das pessoas idosas sejam reconhecidos nos currículos e nos materiais pedagógicos da EJA."}, {"id": "11.17", "texto": "Assegurar a oferta de AEE aos estudantes da EJA que integram o público da educação especial."}, {"id": "11.18", "texto": "Fomentar avaliações diagnósticas e formativas nas unidades educacionais e nos sistemas de ensino."}, {"id": "11.19", "texto": "Induzir processos de autoavaliação participativa das escolas, com foco na melhoria contínua de sua qualidade."}, {"id": "11.20", "texto": "Assegurar, no prazo de 3 (três) anos, a revisão das diretrizes curriculares para a EJA."}, {"id": "11.21", "texto": "Construir na rede municipal de educação de Rosário do Catete, através do Conselho Municipal de Educação currículos específicos para a EJA."}, {"id": "11.22", "texto": "Incentivar a participação dos docentes em curso de pós-graduação voltados para a atuação docente na EJA."}, {"id": "11.23", "texto": "Disponibilizar, de forma sistemática, regular e gratuita, obras didáticas e literárias a todos os estudantes da EJA matriculados na rede municipal de ensino."}]}, {"num": 12, "title": "Educação Profissional e Tecnológica", "objetivo": "Apoiar o acesso, a permanência e a conclusão na educação profissional e tecnológica, com inclusão e redução de desigualdades, visando à sua superação.", "metas": [{"id": "12.a", "texto": "Apoiar e estimular as matrículas da educação profissional técnica de nível médio, inte-grada ou concomitante, de modo a atingir 50% (cinquenta por cento) dos estudantes matriculados no ensino médio, assegurando a qualidade da oferta e a permanência do estudante, observados, no mínimo, 50% (cinquenta por cento) da expansão no segmento público até o final da vigência do PNE e PME."}, {"id": "12.b", "texto": "Apoiar a expansão de, no mínimo, 60% (sessenta por cento) das matrículas nos cursos subsequentes, de forma a assegurar a qualidade da oferta e a permanência dos estudantes."}, {"id": "12.c", "texto": "Expandir para, no mínimo, 25% (vinte e cinco por cento) as matrículas da educação de jovens e adultos, nos ensinos fundamental e médio, na forma articulada à educação profissional até o quinto ano de vigência deste PME, alcançando, no mínimo, 50% (cinquenta por cento) até o final de sua vigência."}, {"id": "12.d", "texto": "Colaborar para que pelo menos 90% (noventa por cento) dos estudantes matriculados na educação profissional técnica de nível médio, na forma integrada ou concomitante, con-cluam seus cursos na idade regular, de modo a promover a equidade e a atenção à diversidade populacional."}, {"id": "12.e", "texto": "Elevar para 10% (dez por cento) o percentual da população de 18 (dezoito) a 24 (vinte e quatro) anos com formação em educação técnica de nível médio, com vistas a reduzir as desigualdades entre os diversos grupos sociais, considerando, pelo menos, raça/cor, sexo, nível socioeconômico, região e localização."}], "estrategias": [{"id": "12.1", "texto": "Estimular a formação profissional por meio da diversificação da oferta da educação profissional e tecnológica, em consonância com as demandas e as especificidades do mundo do trabalho, da sociedade, dos territórios, das populações e das juventudes, especialmente daquelas em situação de vulnerabilidade."}, {"id": "12.2", "texto": "Apoiar a expansão das matrículas da educação profissional técnica de nível médio na Rede Federal de Educação Profissional, Científica e Tecnológica, prioritariamente na forma integrada, considerada a sua vinculação com arranjos produtivos, sociais e culturais locais e regionais e a interiorização da educação profissional."}, {"id": "12.3", "texto": "Apoiar a expansão da oferta da educação profissional técnica de nível médio na rede pública estadual de ensino."}, {"id": "12.4", "texto": "Estimular a articulação entre as redes da educação profissional e tecnológica, com o objetivo de diversificar a oferta nos diferentes territórios."}, {"id": "12.5", "texto": "Ampliar iniciativas de verticalização da educação profissional e tecnológica, por meio da integração curricular entre os diferentes níveis e etapas de ensino e de iniciativas de aprovei-tamento de estudos e de reconhecimento de saberes, observado o disposto na Lei nº 14.645, de 2 de agosto de 2023, bem como as diretrizes curriculares nacionais sobre a modalidade, com vistas a promover oportunidades de continuidade dos estudos dos egressos."}, {"id": "12.6", "texto": "Fomentar parcerias de instituições de educação profissional e tecnológica, preferenci-almente públicas, com órgãos estaduais, distrital e municipais responsáveis pela modalidade, para ampliar a oferta em áreas subatendidas, considerando as particularidades culturais e os contextos de vulnerabilidade socioeconômica, com a finalidade de ampliar as oportunidades de acesso a essa modalidade, inclusive no período noturno, em especial para as populações negra, indígena, quilombola, do campo, das águas, das florestas, do sistema socioeducativo e prisional e para o público da educação especial."}, {"id": "12.7", "texto": "Ampliar políticas de assistência estudantil para todos aqueles que delas necessitem, em especial para as populações negra, indígena, quilombola, do campo, das águas, das florestas, do sistema socioeducativo e prisional e refugiadas e para o público da educação especial, considerando as particularidades culturais e os contextos de vulnerabilidade socioeconômica, com o objetivo de garantir o acesso e a permanência nesta modalidade."}, {"id": "12.8", "texto": "Estimular ações de busca ativa do público da educação profissional e tecnológica, com base em levantamento e mapeamento prévios, considerando as particularidades culturais e os contextos de vulnerabilidade socioeconômica, que garantam oportunidades de acesso e a permanência nessa modalidade a todos, em especial às populações negra, indígena, quilombola, do campo, das águas, das florestas e do sistema socioeducativo e prisional e ao público da educação especial."}, {"id": "12.9", "texto": "Instituir política de combate à discriminação e aos estereótipos, com o objetivo de promover a inclusão e a permanência de mulheres na educação profissional e tecnológica em áreas com menor presença de mulheres."}, {"id": "12.10", "texto": "Instituir política de auxílio aos estudantes com filhos, com o objetivo de propiciar a inclusão e a permanência na educação profissional e tecnológica, em especial a estudantes da educação profissional e tecnológica articulada à educação de jovens e adultos."}, {"id": "12.11", "texto": "Promover campanhas permanentes de comunicação para informar e orientar a socie-dade, em especial os estudantes da educação básica, sobre as áreas de atuação profissional, as ofertas disponíveis e as perspectivas sociais, econômicas e culturais da educação profissional e tecnológica, consideradas as especificidades dos públicos."}, {"id": "12.12", "texto": "Fomentar a adoção de estratégias que ampliem o acesso à educação profissional e tecnológica por estudantes cujo perfil demográfico - em termos de raça/cor, sexo e nível so-cioeconômico - reflita o do restante do ensino médio da rede pública ou, alternativamente, da população vulnerável do território."}, {"id": "12.13", "texto": "Estabelecer, com base em referenciais nacionais de qualidade, mecanismos que orien-tem a expansão da oferta da educação profissional e tecnológica em todos os níveis, considerando a sua relação com o setor produtivo."}]}, {"num": 13, "title": "Acesso, Permanência e Conclusão na Graduação", "objetivo": "Apoiar o acesso, a permanência e a conclusão na graduação, com qualidade, inclusão e redução de desigualdades, visando à sua superação.", "metas": [{"id": "13.a", "texto": "Elevar o percentual da população rosarense de 18 (dezoito) a 24 (vinte e quatro) anos com acesso a cursos de graduação com qualidade para 40% (quarenta por cento), de modo a reduzir as desigualdades entre os diversos grupos sociais, considerando, pelo menos, raça/cor, sexo, nível socioeconômico, região e localização."}, {"id": "13.b", "texto": "Elevar o percentual da população rosarense entre 25 (vinte e cinco) e 34 (trinta e quatro) anos com educação superior completa para 40% (quarenta por cento), em cursos de graduação com qualidade, com vistas a reduzir as desigualdades entre os diversos grupos sociais, considerando, pelo menos, raça/cor, sexo, nível socioeconômico, região e localização."}, {"id": "13.c", "texto": "Elevar para 60% (sessenta por cento) a taxa bruta de escolarização na educação superior."}], "estrategias": [{"id": "13.1", "texto": "Apoiar a expansão quantitativa e qualitativamente planejada, a partir de um diagnóstico de demanda e das necessidades de desenvolvimento econômico, local e regional, com susten-tabilidade socioambiental, visando garantir o acesso, a ocupação das vagas, a permanência e a conclusão nos cursos de graduação, nas modalidades presencial e a distância."}, {"id": "13.2", "texto": "Apoiar mecanismos para elevar gradualmente a taxa de conclusão na graduação em instituições públicas, privadas e comunitárias, com base na avaliação institucional e em políticas de permanência."}, {"id": "13.3", "texto": "Estimular a expansão articulada das instituições de ensino superior federais, estaduais e municipais cujo ensino seja gratuito, considerando a complementariedade e a interiorização das redes para assegurar o atendimento em todo o território nacional."}, {"id": "13.4", "texto": "Fomentar mecanismos e eliminar barreiras para ampliar o acesso de estudantes de escola pública da educação básica e em situação de vulnerabilidade socioeconômica, a fim de ampliar as oportunidades educacionais e promover o acesso à educação superior."}, {"id": "13.5", "texto": "Instituir políticas que promovam o acesso, a permanência e a conclusão em cursos de graduação nas áreas de ciência, tecnologia, engenharia e matemática, preferencialmente para mulheres."}, {"id": "13.6", "texto": "Apoiar o fortalecimento e a ampliação de políticas afirmativas e de assistência estudantil e processos seletivos e infraestrutura adequados aos diferentes públicos, de forma a promover, efetivamente, o acesso, a participação, a permanência e a conclusão da graduação a estudantes em situação de vulnerabilidade socioeconômica, negros, indígenas, quilombolas, do campo, das águas, das florestas, refugiados e do sistema socioeducativo e prisional e público da educação especial, e demais grupos socialmente vulneráveis, consideradas as interseccionalidades, enten-didas como as sobreposições dessas condições, com vistas ao aprimoramento na concepção e na implementação dessas políticas afirmativas."}, {"id": "13.7", "texto": "Instituir programa municipal de apoio ao estudante da educação superior, destinado à concessão direta de bolsas de estudos a alunos integrantes de famílias de baixa renda regu-larmente matriculados em cursos de graduação oferecidos por instituições de ensino superior privadas, comunitárias e regidas pelo estabelecido no art. 242 da Constituição Federal de 1988, devidamente autorizados ou reconhecidos pelo Ministério da Educação e com avaliação positiva no Sistema Nacional de Avaliação da Educação Superior (Sinaes), até o prazo final do PME."}, {"id": "13.8", "texto": "Instituir avaliação periódica das políticas afirmativas, de assistência estudantil e de aces-sibilidade para o seu contínuo aperfeiçoamento, considerada a participação na composição do corpo discente de estudantes em situação de vulnerabilidade socioeconômica, negros, indíge-nas, quilombolas, do campo, das águas, das florestas e do sistema socioeducativo e prisional e público da educação especial."}, {"id": "13.9", "texto": "Implementar política de auxílio aos estudantes com filhos, de forma a propiciar a inclusão e a permanência na educação superior, nos termos da Lei nº 14.914, de 3 de julho de 2024, que institui a Política Nacional de Assistência Estudantil (Pnaes)."}]}]}, {"gt": "GT 3", "desc": "Eixos II e VI – Metas 8, 9 e 10", "metas": [{"num": 8, "title": "Sustentabilidade Socioambiental na Educação", "objetivo": "Promover a educação ambiental e o enfrentamento das mudanças do clima em todos os estabelecimentos de ensino.", "metas": [{"id": "8.a", "texto": "Garantir que, até o quinto ano de vigência deste PME, no mínimo 60% (sessenta por cento) das redes de ensino e, até o final do decênio, a totalidade dessas redes desenvolvam planos para prevenção, mitigação e adaptação às mudanças do clima e os implementem em seus estabelecimentos de ensino."}, {"id": "8.b", "texto": "Assegurar que todos os estabelecimentos de ensino tenham estrutura física e instalações que atendam a padrões de conforto térmico."}, {"id": "8.c", "texto": "Assegurar que todas as instituições de ensino promovam a educação ambiental com base na Política Nacional de Educação Ambiental e nas diretrizes curriculares nacionais do Conselho Nacional de Educação (CNE)."}], "estrategias": [{"id": "8.1", "texto": "Apoiar técnica e financeiramente, em regime de colaboração, a elaboração e a imple-mentação de planos para prevenção, mitigação e adaptação às mudanças climáticas na área educacional."}, {"id": "8.2", "texto": "Desenvolver, de forma intersetorial e ouvindo as comunidades escolares, ações de pre-venção, mitigação e adaptação às mudanças do clima no ambiente escolar."}, {"id": "8.3", "texto": "Incentivar a participação da comunidade escolar na construção, apropriação e disse-minação de conhecimentos científicos, transdisciplinares e de saberes comunitários sobre as implicações das mudanças do clima e as formas de prevenção, adaptação, mitigação e regenera-ção."}, {"id": "8.4", "texto": "Aderir a programas nacionais e estaduais de financiamentos de apoio ao município na promoção da sustentabilidade socioambiental na educação, que considere, no mínimo, as se-guintes dimensões: adequação das instalaç
