ões escolares públicas aos efeitos da mudança no clima, transporte, alimentação e gestão de resíduos."}, {"id": "8.5", "texto": "Ter como parâmetros referenciais nacionais e regionais de infraestrutura física e insta-lações escolares que atendam a padrões de sustentabilidade socioambiental e de adaptação às mudanças do clima."}, {"id": "8.6", "texto": "Fomentar a instalação, nas escolas públicas, de sistemas para uso racional e reaproveita-mento de água, bem como para captação e reúso de águas pluviais."}, {"id": "8.7", "texto": "Fomentar soluções para a racionalização e a eficiência do consumo de energia nas escolas, por meio de melhorias na infraestrutura, adoção de tecnologias eficientes e gestão otimizada dos recursos energéticos."}, {"id": "8.8", "texto": "Assegurar que todas as redes de ensino implementem a gestão adequada dos resíduos sólidos."}, {"id": "8.9", "texto": "Fomentar a instalação e a ampliação, nos estabelecimentos de ensino, de áreas verdes destinadas à promoção de bem-estar, lazer, contato com a natureza e aprendizagem, articulando-as aos projetos pedagógicos e às atividades de educação ambiental."}, {"id": "8.10", "texto": "Estimular parcerias dos sistemas de ensino com instituições de ensino superior e de educação profissional e tecnológica, com vistas ao desenvolvimento de soluções infraestruturais ambientalmente sustentáveis a serem implementadas nas escolas."}, {"id": "8.11", "texto": "Estabelecer diretrizes para o uso responsável e sustentável de materiais, dispositivos e equipamentos no ambiente escolar, com orientações sobre a gestão do ciclo de vida desses produtos, a adoção de práticas de logística reversa e o descarte adequado de resíduos."}, {"id": "8.12", "texto": "Elaborar e disseminar, em regime de colaboração e em parceria com a Defesa Civil e ór-gãos públicos, protocolos de segurança e planos escolares de prevenção e resposta a emergências climáticas."}, {"id": "8.13", "texto": "Promover a criação de cursos de educação profissional e tecnológica de nível médio com desenhos curriculares interdisciplinares e com abordagens transdisciplinares de questões relativas à responsabilidade socioambiental e às formas de mitigação, adaptação e regeneração do ambiente em razão dos efeitos das mudanças do clima, além de temas ligados à economia verde, à bioeconomia e ao conhecimento tradicional associado à biodiversidade."}, {"id": "8.14", "texto": "Implementar estratégias pedagógicas em educação ambiental que promovam a integração entre saberes e a transversalidade entre as áreas de conhecimento."}, {"id": "8.15", "texto": "Incentivar o desenvolvimento de metodologias inovadoras que potencializem o desen-volvimento de conhecimentos, habilidades, atitudes e valores atinentes à consciência socioam-biental no ambiente escolar."}, {"id": "8.16", "texto": "Estimular vivências que promovam o reconhecimento, o respeito, a responsabilidade e o convívio cuidadoso com todos os seres vivos, inclusive como forma de evitar que os animais sejam submetidos a qualquer tipo de crueldade, em consonância com o disposto no inciso VII do § 1º do art. 225 da Constituição Federal."}, {"id": "8.17", "texto": "Apoiar projetos de pesquisa e extensão voltados à construção de instrumentos e meto-dologias para a abordagem educacional da dimensão socioambiental."}, {"id": "8.18", "texto": "Fomentar a produção e assegurar a disponibilização de materiais didáticos e pedagógicos de educação ambiental alinhados com a Política Nacional de Educação Ambiental e as diretrizes curriculares do CNE em todos os níveis e modalidades de ensino."}, {"id": "8.19", "texto": "Garantir, em articulação com os órgãos normativos dos sistemas de ensino e as institu-ições de ensino superior e de educação profissional e tecnológica, que os cursos de formação inicial e continuada de professores qualifiquem os futuros docentes para o desenvolvimento didático-pedagógico da educação ambiental na sua atuação escolar e acadêmica."}, {"id": "8.20", "texto": "Promover programas de formação continuada em educação ambiental para o corpo docente e demais profissionais da educação, com ênfase em sustentabilidade, biodiversidade e prevenção, mitigação e adaptação a desastres socioambientais e emergências climáticas."}, {"id": "8.21", "texto": "Acompanhar os levantamentos dos órgãos oficiais de estatística, de modo que sejam disponibilizadas informações confiáveis periódicas sobre a promoção da educação ambiental em todos os níveis e modalidades de ensino."}, {"id": "8.22", "texto": "Incentivar a criação de comissões de meio ambiente e qualidade de vida nas instituições de ensino e assegurar seu funcionamento."}, {"id": "8.23", "texto": "Aderir a programas ambientais do Fundo Nacional sobre Mudança do Clima, instituído pela Lei nº 12.114, de 9 de dezembro de 2009, no desenvolvimento de ações de educação ambiental e de enfrentamento das mudanças do clima nas instituições públicas de ensino."}]}, {"num": 9, "title": "Educação Escolar Indígena, do Campo e Quilombola", "objetivo": "Garantir o acesso, a oferta e a permanência em todos os níveis, as etapas e as modali-dades na educação escolar indígena, na educação do campo e na educação escolar quilombola, observados os padrões nacionais de qualidade, com redução das desigualdades regionais.", "metas": [{"id": "9.a", "texto": "Ampliar a oferta de vagas em creches na modalidade de educação escolar indígena, de modo a atender 100% (cem por cento) da demanda manifesta e, em nível nacional, atingir, no mínimo, 50% (cinquenta por cento) das crianças de 0 (zero) a até 3 (três) anos desta modalidade até o final da vigência deste PME."}, {"id": "9.b", "texto": "Ampliar a oferta de vagas em creches na modalidade de educação do campo, de modo a atender 100% (cem por cento) da demanda manifesta e, em nível nacional, atingir, no mínimo, 50% (cinquenta por cento) das crianças de 0 (zero) a até 3 (três) anos desta modalidade até o final da vigência deste PME."}, {"id": "9.c", "texto": "Ampliar a oferta de vagas em creches na modalidade de educação escolar quilombola, de modo a atender 100% (cem por cento) da demanda manifesta e, em nível nacional, atingir, no mínimo, 50% (cinquenta por cento) das crianças de 0 (zero) a até 3 (três) anos desta modalidade até o final da vigência deste PME."}, {"id": "9.d", "texto": "Universalizar o atendimento das crianças e estudantes na pré-escola, no ensino funda-mental e no ensino médio, na modalidade de educação escolar indígena, em conformidade com as diretrizes curriculares nacionais da modalidade, o direito ao multilinguismo e a intercultura-lidade."}, {"id": "9.e", "texto": "Universalizar o atendimento das crianças e dos estudantes na pré-escola, no ensino fundamental e no ensino médio, em conformidade com as diretrizes curriculares nacionais da modalidade educação do campo."}, {"id": "9.f", "texto": "Universalizar o atendimento das crianças e dos estudantes na pré-escola, no ensino fundamental e no ensino médio, em conformidade com as diretrizes curriculares nacionais da modalidade educação escolar quilombola."}, {"id": "9.g", "texto": "Assegurar que toda a oferta de creche, de pré-escola, de ensino fundamental e de ensino médio nas modalidades da educação escolar indígena, da educação do campo e da educação escolar quilombola alcance padrões nacionais de qualidade, considerados, no mínimo, as di-mensões de infraestrutura física, os profissionais da educação, os recursos pedagógicos e a acessibilidade."}], "estrategias": [{"id": "9.1", "texto": "Assegurar a formação básica comum, a definição de matrizes curriculares das redes de ensino e projetos pedagógicos das escolas que respeitem as culturas das comunidades, por meio da observância e do aperfeiçoamento das diretrizes curriculares nacionais da educação escolar indígena, da educação do campo e da educação escolar quilombola, considerada a autonomia pedagógica e administrativa dessas escolas."}, {"id": "9.2", "texto": "Garantir o cumprimento das Leis nº 10.639, de 9 de janeiro de 2003, e nº 11.645, de 10 de março de 2008, que tratam da obrigatoriedade do estudo da História e Cultura Afro Brasileira, Africana e Indígena, com o objetivo de considerar a riqueza e a contribuição da diversidade negra, quilombola e indígena para a compreensão da cultura e da história nacional, assegurando a sua implementação."}, {"id": "9.3", "texto": "Ampliar a produção de materiais didáticos específicos e a elaboração de instrumentos de acompanhamento que considerem o uso da língua materna pelas comunidades indígenas e a identidade cultural das comunidades do campo, das águas, das florestas, indígenas e quilombolas."}, {"id": "9.4", "texto": "Implementar, em todas as escolas, currículos alinhados às diretrizes curriculares nacionais da educação do campo, pautados na pedagogia da alternância, com a finalidade de ampliar o acesso, a permanência, a qualidade e a conclusão na educação básica, e fortalecer a identidade cultural e o bem-viver dessas populações."}, {"id": "9.5", "texto": "Garantir as diretrizes curriculares nacionais da educação escolar indígena, respeitados os projetos pedagógicos diferenciados, com o objetivo de promover a equidade de acesso e os direitos de aprendizagem dos estudantes indígenas."}, {"id": "9.6", "texto": "Aderir à políticas de assistência, permanência e conclusão dos estudos para estudantes do campo e indígenas, em todas as etapas e as modalidades da educação básica."}, {"id": "9.7", "texto": "Fomentar a oferta de ensino médio e de educação de jovens e adultos para estudantes indígenas e do campo, preferencialmente de forma articulada à educação profissional e tecno-lógica e alinhada aos arranjos produtivos locais e às demandas de suas comunidades, com o objetivo de preservar as especificidades linguísticas, identitárias e culturais, reduzir o abandono e a evasão escolar, com vistas à sua superação, e promover a inserção desses estudantes no mundo do trabalho, seu pleno desenvolvimento e seu preparo para o exercício da cidadania."}, {"id": "9.8", "texto": "Ter como parâmetro padrões nacionais de qualidade, que considerem a infraestrutura baseada no conceito de escolas inclusivas, sustentáveis e adaptadas aos efeitos das mudanças climáticas, aplicado na construção, ampliação, reestruturação e manutenção desses espaços, a alimentação, o transporte escolar, os profissionais da educação, os recursos pedagógicos e tecnológicos e o acesso à internet banda larga, respeitado o desenho universal de acessibilidade e consideradas as diversidades territoriais, culturais e ambientais e as especificidades das etapas e das modalidades de ensino, com destaque, na educação escolar indígena, com vistas a atender o direito à educação intercultural, específica, diferenciada, bilíngue ou multilíngue e comunitária."}, {"id": "9.9", "texto": "Ampliar a política de oferta da alimentação escolar adquirida da agricultura familiar, res-peitadas as características culturais de alimentação e as especificidades dos territórios indígenas, de forma a aprimorar os processos de aquisição e a apoiar os produtores locais."}, {"id": "9.10", "texto": "Aderir a política nacional de produção e distribuição de materiais didáticos, pedagógicos e literários para estudantes e profissionais do magistério, com garantia de qualidade, preferenci-almente de autoria e com a participação das comunidades indígenas e do campo, das instituições voltadas a essas comunidades, e que considere os saberes tradicionais e as evidências científicas, articulando essa política às ações de ensino, pesquisa e extensão desenvolvidas por instituições de ensino superior."}, {"id": "9.11", "texto": "Implementar política de avaliação específica da qualidade da educação escolar indígena, da educação do campo, considerados os aspectos culturais, linguísticos e educacionais des-sas comunidades, com o objetivo de gerar subsídios para a formulação, a implementação, o monitoramento e a avaliação das políticas para essas modalidades."}, {"id": "9.12", "texto": "Apoiar a implementação de Territórios Etnoeducacionais (TEEs), conforme o disposto no Decreto nº 6.861, de 27 de maio de 2009, que funcionem como mecanismos de pactuação da educação escolar indígena."}, {"id": "9.13", "texto": "Promover articulações intersetoriais com direitos humanos, saúde, meio ambiente e edu-cação ambiental, cultura, juventude, desenvolvimento social e agrário, comunicações e energia, para promover o desenvolvimento da educação nos TEEs e nas comunidades quilombolas e do campo."}, {"id": "9.14", "texto": "Ofertar formação para secretários de educação, equipes técnicas e gestores escolares, com o objetivo de apoiar a implementação de políticas e programas da educação escolar indígena, da educação do campo e da educação escolar quilombola."}, {"id": "9.15", "texto": "Promover o reconhecimento e a valorização, nas matrizes curriculares e propostas pe-dagógicas das escolas indígenas, das técnicas e saberes ancestrais pedagógicos e educacionais, com destaque para seu papel na preservação do meio ambiente e no enfrentamento das mudanças climáticas, observadas as diretrizes curriculares nacionais."}, {"id": "9.16", "texto": "Promover, em regime de colaboração com os entes federativos e com articulações inter-setoriais, a identificação de povos e comunidades tradicionais cujas características socioculturais e territoriais justifiquem a aplicação das medidas previstas neste objetivo, com vistas à imple-mentação de políticas educacionais contextualizadas que assegurem o pleno direito à educação."}, {"id": "9.17", "texto": "Desenvolver e implementar políticas educacionais específicas para povos indígenas resi-dentes em áreas urbanas e em contextos migratórios, garantindo o respeito à identidade cultural, o ensino da língua indígena e a oferta de educação diferenciada."}, {"id": "9.18", "texto": "Implementar diretrizes pedagógicas e administrativas que incorporem a cultura do cui-dado nas escolas indígenas, incluindo a formação continuada de professores e gestores sobre práticas educativas interculturais de acolhimento, atenção psicossocial e promoção da equidade, em diálogo com os saberes e as práticas de cuidado de cada povo indígena."}, {"id": "9.19", "texto": "Apoiar em regime de colaboração, a instituição e a adoção de instrumento nacional para levantamento da demanda por vagas em creche nas modalidades de educação escolar indígena, quilombola e do campo, nos termos da Lei nº 14.851, de 3 de maio de 2024, bem como a implementação de política de busca ativa voltada ao acesso à creche, com caráter informativo e que considere as especificidades dessas populações."}]}, {"num": 10, "title": "Educação Especial Inclusiva e Educação Bilíngue de Surdos", "objetivo": "Garantir, ao longo da vida, o acesso e a permanência na educação especial, assegurando a oferta de AEE de qualidade e a aprendizagem dos estudantes que são o público da educa-ção especial e o público da educação bilíngue de surdos, em todos os níveis, as etapas e as modalidades.", "metas": [{"id": "10.a", "texto": "Universalizar, para o público da educação especial, na faixa etária de 4 (quatro) a 17 (dezessete) anos, o acesso e a permanência na educação básica, e promover a qualidade da aprendizagem, preferencialmente na rede regular de ensino, com a garantia de sistema educacional inclusivo."}, {"id": "10.b", "texto": "Ampliar a oferta de AEE, com a disponibilização de salas de recursos multifuncionais, para, no mínimo, 80% (oitenta por cento) do público do AEE, até o quinto ano de vigência deste PME, e universalizar a oferta até o final do decênio."}, {"id": "10.c", "texto": "Universalizar, para o público da educação bilíngue de surdos, na faixa etária de 4 (quatro) a 17 (dezessete) anos, o acesso, a permanência e a conclusão, e promover a qualidade da aprendizagem na educação básica."}, {"id": "10.d", "texto": "Alfabetizar todo o público da educação bilíngue de surdos em Língua Brasileira de Sinais (Libras), como primeira língua, desde a educação infantil até o primeiro ano do ensino fundamental, e em português escrito, como segunda língua, até o final do segundo ano do ensino fundamental."}], "estrategias": [{"id": "10.1", "texto": "Aderir, em regime de colaboração, aos futuros indicadores nacionais de avaliação insti-tucional com base no perfil do público da educação especial, do público da educação bilíngue de surdos e do corpo de profissionais da educação."}, {"id": "10.2", "texto": "Garantir e monitorar a acessibilidade, na forma definida pelo art. 30, inciso I, da Lei nº 13.146, de 6 de julho de 2015 (Estatuto da Pessoa com Deficiência), em todas as escolas, em conformidade com as normas brasileiras, com o objetivo de eliminar barreiras e garantir o acesso e a participação de todas as pessoas no espaço escolar."}, {"id": "10.3", "texto": "Garantir a oferta de vagas da educação básica para o público da educação especial e para o público da educação bilíngue de surdos nas redes de ensino, com redução de desigualdades regionais e territoriais de oferta e priorização de escolas que atendam estudantes em situação de vulnerabilidade socioeconômica, negros, indígenas, quilombolas, das águas, das florestas e do campo."}, {"id": "10.4", "texto": "Instituir redes de serviço de suporte ao público da educação especial e ao público da educação bilíngue de surdos, com profissionais de apoio escolar, intérpretes de Libras, educa-dores com conhecimento do sistema Braille, especialistas em tecnologias assistivas, revisores de Braille, psicólogos escolares e assistentes sociais, entre outros."}, {"id": "10.5", "texto": "Garantir a disponibilização de recurso de uso pessoal de tecnologia assistiva para o público da educação especial e o público da educação bilíngue de surdos para apoiar o acesso pleno ao currículo, a permanência e o desenvolvimento desses estudantes."}, {"id": "10.6", "texto": "Ampliar a oferta e fomentar pesquisas sobre materiais pedagógicos, livros acessíveis e recursos de tecnologia assistiva, com o objetivo de promover os direitos de participação e aprendizagem do público da educação especial e do público da educação bilíngue de surdos."}, {"id": "10.7", "texto": "Assegurar e monitorar a participação do público da educação especial e do público da educação bilíngue de surdos nas avaliações nacionais e em outras avaliações em cada sistema de ensino, consideradas as especificidades desse público e garantidas as medidas de acessibilidade."}, {"id": "10.8", "texto": "Fomentar políticas de educação profissional e tecnológica ao público da educação es-pecial e ao público da educação bilíngue de surdos, inclusive por meio de cursos planejados e adaptados, com vistas à redução das desigualdades linguísticas, étnico-raciais e regionais no acesso e na permanência, de forma a estimular a conclusão da educação básica."}, {"id": "10.9", "texto": "Garantir transporte municipal e intermunicipal gratuito e acessível para o público da educação especial e o público da educação bilíngue de surdos matriculado em todas as etapas e modalidades da educação básica, com vistas a reduzir a evasão e a exclusão escolar e o tempo médio de deslocamento entre a escola e a residência."}, {"id": "10.10", "texto": "Fortalecer a formação inicial e continuada com ênfase na educação especial no âmbito de sistema educacional inclusivo e na educação bilíngue de surdos, para professores, gestores escolares e demais profissionais da educação, com o objetivo de aperfeiçoar as práticas peda-gógicas, fortalecer a identificação do público da educação especial e promover a qualidade da educação para o público da educação especial e o público da educação bilíngue de surdos."}, {"id": "10.11", "texto": "Criar núcleo de gestão para as modalidades da educação especial e da educação bilíngue de surdos na secretaria municipal de educação e nas escolas do sistema municipal de educação para garantir apoio, formação, pesquisa e assessoria na área, de forma transversal, e articulá-los com instituições de ensino e entidades representativas das comunidades."}, {"id": "10.12", "texto": "Aprimorar os levantamentos dos órgãos oficiais de estatística, inclusive aqueles reali-zados pelo Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep) e pela Fundação Instituto Brasileiro de Geografia e Estatística (IBGE), nas dimensões de educação, saúde e assistência social, de forma a identificar a especificidade e as demandas do público da educação especial e do público da educação bilíngue de surdos e a orientar o planejamento, a construção, o monitoramento e a avaliação das políticas pelos entes federativos, garantindo o levantamento e a divulgação de dados desagregados e microdados, respeitada a anonimiza-ção estabelecida na Lei nº 13.709, de 14 de agosto de 2018 (Lei Geral de Proteção de Dados Pessoais)."}, {"id": "10.13", "texto": "Induzir a adoção de mecanismos para atrair profissionais do magistério experientes e com formação inicial ou continuada adequada com ênfase na educação especial no âmbito de sistema educacional inclusivo e na educação bilíngue de surdos para atuarem no atendimento ao público da educação especial e ao público da educação bilíngue de surdos."}, {"id": "10.14", "texto": "Incentivar a formação inicial e continuada de professores com ênfase na educação especial inclusiva e na educação bilíngue de surdos, em regime de colaboração."}, {"id": "10.15", "texto": "Promover, em regime de colaboração, a formação profissional específica dos profis-sionais de apoio escolar e dos demais profissionais que atuam no atendimento ao público da educação especial e ao público da educação bilíngue de surdos de modo a universalizar a for-mação mínima exigida, e incentivar a valorização profissional com organização das carreiras e promoção de condições adequadas de trabalho."}, {"id": "10.16", "texto": "Criar mecanismos para a identificação e o cadastramento dos estudantes com altas habilidades ou superdotação matriculados na educação básica, na educação profissional e tec-nológica e na educação superior, a fim de promover a diferenciação curricular, o atendimento suplementar e a aceleração de estudos, garantindo o apoio e a permanência na escola."}, {"id": "10.17", "texto": "Assegurar, em regime de colaboração, a atualização e implementação das diretrizes nacionais da educação especial e do AEE, de maneira a abranger a jornada, a alimentação, o transporte escolar, o financiamento, os recursos pedagógicos e os profissionais da educação, respeitadas as medidas de acessibilidade e consideradas as diversidades territoriais, as especifici-dades das etapas e as modalidades da educação, com vistas a atender aos direitos de participação e de aprendizagem, inclusive em instituições privadas, sem fins lucrativos, especializadas e com atuação exclusiva em educação especial, conveniadas com o poder público."}, {"id": "10.18", "texto": "Fomentar a implementação da avaliação biopsicossocial por equipe multidisciplinar para identificação dos estudantes que são o público da educação especial, prevista na Lei nº 13.146, de 6 de julho de 2015 (Estatuto da Pessoa com Deficiência)."}, {"id": "10.19", "texto": "Implantar e melhorar a infraestrutura de salas de recursos multifuncionais e diversificar as formas do AEE, para além do contraturno, de modo a também atender estudantes no turno da escolarização, possibilitada a forma remota nas situações de regime escolar especial previstas no art. 81-A da Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), com visita domiciliar ou hospitalar, entre outros, com vistas a garantir o direito à educação, a permanência e a aprendizagem do público da educação especial."}, {"id": "10.20", "texto": "Fomentar serviços públicos de suporte, presenciais e remotos, com padrão nacional de qualidade, em centros multidisciplinares de apoio, pesquisa e assessoria, articulados com a rede de formação continuada de profissionais da educação, com a finalidade de apoiar e formar os profissionais para a educação especial e o AEE no âmbito de sistema educacional inclusivo."}, {"id": "10.21", "texto": "Incentivar a ampliação de cursos de formação continuada em educação especial e em Libras, no âmbito de sistema educacional inclusivo, de modo a assegurar a formação adequada a todos os profissionais que atuam ou venham a atuar no AEE, em instituições de educação básica, profissional e tecnológica e superior."}, {"id": "10.22", "texto": "Incentivar a universalização do Plano de Atendimento Educacional Especializado e a elaboração de instrumentos pedagógicos individualizados de acessibilização curricular, garan-tindo sua fundamentação em estudo de caso realizado com participação do estudante e da família e, quando necessário, de equipe multidisciplinar."}, {"id": "10.23", "texto": "Incorporar as diretrizes nacionais a educação bilíngue de surdos, em regime de colabo-ração, com vistas a orientar a construção de documentos curriculares que considerem: a Libras como língua de instrução, interação, comunicação e ensino; o português escrito como segunda língua; e as especificidades linguísticas, identitárias e culturais do público da educação bilíngue de surdos, respeitada a diversidade regional, estadual e local."}, {"id": "10.24", "texto": "Construir no sistema municipal de ensino atos normativos, em consonância com as políticas públicas de alfabetização em Libras e em português escrito para a educação bilíngue de surdos, que promovam a participação de pessoas surdas em todas as instâncias e etapas de discussão do processo de formulação de programas e de instrumentos avaliativos voltados ao público da educação bilíngue de surdos."}, {"id": "10.25", "texto": "Definir, no planejamento educacional, mediante pactuação federativa, o encaminha-mento do público da educação bilíngue de surdos de todas as faixas etárias, em especial na primeira infância, à modalidade da educação bilíngue de surdos, com o objetivo de assegurar o desenvolvimento da alfabetização em Libras."}, {"id": "10.26", "texto": "Fomentar o acompanhamento e o monitoramento, em processo contínuo, do acesso linguístico e da permanência de bebês e crianças surdas na educação infantil em escolas bilíngues de surdos, escolas-polos bilíngues de surdos, escolas comuns e classes bilíngues de surdos, em especial dos beneficiários de programas de transferência de renda, em colaboração com as famílias e com os órgãos públicos de assistência social e proteção à infância."}, {"id": "10.27", "texto": "Instituir, em regime de colaboração, a política nacional de formação dos profissionais da educação bilíngue de surdos de que trata o art. 60-B da Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), de modo a assegurar que todos os professores da educação básica que atuam ou que venham a atuar em educação bilíngue de surdos possuam formação e especialização adequadas, em nível superior, com processos seletivos adequados, com bancas de avaliação prática da Libras compostas por avaliadores fluentes em Libras, com ao menos uma pessoa surda."}, {"id": "10.28", "texto": "Incentivar a oferta de cursos de extensão em Libras para ouvintes, com prioridade para os pais ou responsáveis por bebês e crianças matriculados na educação bilíngue de surdos."}]}]}, {"gt": "GT 4", "desc": "Eixos III, IV e V – Metas 14, 15 e 16", "metas": [{"num": 14, "title": "Formação e Valorização dos Profissionais da Educação Básica", "objetivo": "Garantir formação, valorização e condições de trabalho adequadas aos profissionais da educação básica, de modo a elevar a qualidade da educação.", "metas": [{"id": "14.a", "texto": "Assegurar, até o quinto ano de vigência deste PME, que todos os docentes da educação básica possuam formação específica em nível superior, obtida em curso de pedagogia para a edu-cação infantil e os anos iniciais do ensino fundamental, e licenciatura nas áreas do conhecimento, nos componentes curriculares ou disciplinas e nas modalidades em que atuam."}, {"id": "14.b", "texto": "Valorizar os profissionais do magistério com nível superior nas redes públicas de educa-ção básica, no município de Rosário do Catete, com vistas a equiparar o rendimento médio dos profissionais de cada etapa da educação básica ao dos trabalhadores das demais ocupações com requisito de escolaridade equivalente."}, {"id": "14.c", "texto": "Garantir a existência de planos de carreira, estabelecidos em lei, para todos os profissio-nais da educação básica pública e para os profissionais do magistério, adotados como referência o piso salarial nacional profissional e o limite máximo de 2/3 (dois terços) da carga horária para atividades de interação com os educandos."}, {"id": "14.d", "texto": "Reduzir progressivamente o número de profissionais do magistério sem cargo efetivo a no máximo 30% (trinta por cento) na rede municipal de ensino, em consonância com o que estabelece o art. 206, inciso V, da Constituição Federal, até o final do quinto ano de vigência deste PME."}, {"id": "14.e", "texto": "Incentivar que, no mínimo, 50% (cinquenta por cento) dos concluintes dos cursos de pedagogia e licenciaturas alcancem o padrão de desempenho adequado no Enade até o quinto ano de vigência deste PME e que, no mínimo, 70% (setenta por cento) dos concluintes destes cursos alcancem o padrão de desempenho adequado no Enade até o final do decênio."}, {"id": "14.f", "texto": "Garantir que 70% (setenta por cento) dos docentes da educação básica concluam cursos de pós-graduação relacionados com a respectiva área de atuação profissional que promovam o aprimoramento da docência, das práticas pedagógicas ou do exercício das demais funções pertinentes ao magistério."}], "estrategias": [{"id": "14.1", "texto": "Apoiar a formação, em nível de graduação os docentes da educação básica, que atuam no município de Rosário do Catete, em cursos preferencialmente alinhados à respectiva área de atuação e prioritariamente ofertados por instituições de ensino superior públicas."}, {"id": "14.2", "texto": "Incentivar a formação, em nível de pós-graduação os docentes da educação básica, que atuam no município de Rosário do Catete, em cursos preferencialmente alinhados à respectiva área de atuação e prioritariamente ofertados por instituições de ensino superior públicas."}, {"id": "14.3", "texto": "Promover, em regime de colaboração, a oferta de cursos de formação continuada em instituições de ensino superior públicas."}, {"id": "14.4", "texto": "Utilizar, em regime de colaboração, padrões de desempenho nacional, para concluintes de cursos de Pedagogia e de licenciatura ."}, {"id": "14.5", "texto": "Fomentar, nos concursos públicos e nas demais formas de seleção e contratação de professores, a utilização de mecanismos que fortaleçam a qualidade dos cursos de licenciatura, com a mobilização de indicadores, com critérios relacionados ao Enade e com o mapeamento desses cursos."}, {"id": "14.6", "texto": "Incentivar que os cursos de formação continuada contemplem, de forma sistemática, permanente e articulada, as áreas de educação integral, de educação ambiental e climática, de educação em direitos humanos, cidadania e democracia, de educação para as relações étnico-raciais e de educação anticapacitista, e os marcos legais de proteção à infância e à adolescência, aos idosos, aos povos indígenas e às pessoas com deficiência."}, {"id": "14.7", "texto": "Incentivar a formação inicial e continuada, com vistas a atender as especificidades da educação profissional e tecnológica, da educação de jovens e adultos, da educação do campo, da educação escolar indígena, da educação escolar quilombola, da educação especial e da educação bilíngue de surdos, inclusive em programas de pós-graduação stricto sensu profissionais."}, {"id": "14.8", "texto": "Promover, por meio de políticas e programas, a valorização dos educadores tradicionais dos povos indígenas e das populações do campo, das águas, das florestas e quilombolas na formação de professores e gestores dessas modalidades, buscando igualdade de condições com os demais docentes."}, {"id": "14.9", "texto": "Apoiar em regime de colaboração, cursos e programas especiais de formação específica na educação superior para docentes com formação de nível médio na modalidade normal, não licenciados ou licenciados em área diferente de sua atuação e que estejam em exercício."}, {"id": "14.10", "texto": "Ampliar e fortalecer a iniciação à docência, preferencialmente por meio de iniciativas que tenham o propósito de qualificar a formação de estudantes das licenciaturas nas instituições de ensino superior."}, {"id": "14.11", "texto": "Fortalecer o estágio probatório a fim de melhorar a qualificação dos profissionais ingressantes na rede municipal de ensino, por meio de formações específicas, em especial as de prática de ensino, bem como supervisão e acompanhamento por profissionais experientes."}, {"id": "14.12", "texto": "Promover iniciativas que favoreçam a troca de experiências e práticas entre os profis-sionais da educação, e entre estes e as instituições de ensino superior, para a reflexão sobre o trabalho pedagógico, e a socialização das pesquisas e dos trabalhos acadêmicos sobre educação."}, {"id": "14.13", "texto": "Ampliar a assistência estudantil para estudantes de cursos superiores de licenciatura nas instituições de ensino superior e criar mecanismos e incentivos à iniciação docente e à permanência no exercício do magistério público."}, {"id": "14.14", "texto": "Estabelecer mecanismos para induzir o cumprimento da jornada de trabalho pelos profissionais do magistério em um único estabelecimento escolar."}, {"id": "14.15", "texto": "Instituir política intersetorial com o objetivo de reduzir o absenteísmo e de promover a prevenção, a atenção e o atendimento à saúde plena e laboral e à integridade física, mental e emocional dos profissionais da educação, nas questões de adoecimento, de violência e de en-frentamento das diferentes formas de assédio, de preconceito, de discriminação e de desrespeito ao disposto nos incisos II, III e IV do art. 3º da Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional)."}, {"id": "14.16", "texto": "Instituir incentivos para valorizar a permanência dos profissionais do magistério em sala de aula de escolas localizadas em contextos vulneráveis, em locais de difícil acesso, no AEE, no atendimento socioeducativo e nas modalidades de educação de jovens e adultos, educação do campo, educação quilombola, educação escolar indígena e educação bilíngue de surdos, com o objetivo de garantir o direito à educação e o desenvolvimento dos estudantes, assim como condições dignas de trabalho para esses profissionais."}, {"id": "14.17", "texto": "Fomentar a formação inicial e continuada para os profissionais da educação técnicos, administrativos e operacionais, consideradas as diretrizes nacionais."}, {"id": "14.18", "texto": "Fortalecer as equipes de gestão das redes de ensino e as equipes gestoras das escolas, observadas as dimensões pedagógica, administrativa e comunitária, apoiando a autonomia das redes e das instituições de ensino."}, {"id": "14.19", "texto": "Pactuar, no âmbito das instâncias permanentes de participação e cooperação entre os entes federativos e com a participação de entidades representativas, proposta de referenciais nacionais para carreiras dos profissionais do magistério que considerem proporcionalmente os diferentes recursos disponíveis por rede, com os objetivos de induzir a melhoria dos planos de carreira e garantir condições adequadas de trabalho e de saúde e a atração e a retenção desses profissionais."}, {"id": "14.20", "texto": "Participar de fórum permanente, com representação da União, dos Estados, do Distrito Federal, dos Municípios e dos trabalhadores da educação, para acompanhamento e avaliação da política de valorização dos profissionais do magistério público da educação básica."}, {"id": "14.21", "texto": "Valorizar e reconhecer a formação continuada, ofertada por instituições de ensino reconhecidas, como integrante do plano de carreira dos profissionais da educação básica pública."}, {"id": "14.22", "texto": "Utilizar, até o quinto ano de vigência deste PME, a prova nacional periodicamente aplicada, com a finalidade de cooperar com os sistemas públicos de ensino nos processos de seleção e de ingresso nas carreiras do magistério da educação básica pública e no exercício de funções de gestão, com vistas à melhoria da qualidade e da adequação da formação profissional à respectiva área de atuação."}, {"id": "14.23", "texto": "Aprimorar o censo da educação, respeitada a Lei nº 13.709, de 14 de agosto de 2018 (Lei Geral de Proteção de Dados Pessoais), de forma a coletar informações sobre formação, condições de trabalho, remuneração e carreira dos profissionais da educação básica, gerando subsídios para monitoramento específico e para a melhoria das políticas de formação, de valorização e de carreira."}, {"id": "14.24", "texto": "Assegurar a regulamentação do piso salarial para os profissionais da educação escolar pública, nos termos do art. 206, inciso VIII, da Constituição Federal, bem como a instituição de seus planos de carreira."}, {"id": "14.25", "texto": "Incentivar a concessão de bolsas de estudos para acesso e permanência dos professores da educação básica na pós-graduação, especialmente em cursos de mestrado e programas de doutorado profissionais, inclusive aqueles voltados para os docentes da educação do campo, da educação indígena, da educação quilombola e da educação especial, em articulação com as redes de ensino."}]}, {"num": 15, "title": "Participação e Controle Social e Gestão Democrática na Educação Pública", "objetivo": "Assegurar a participação e o controle social no planejamento, na gestão democrática, na educação pública, no monitoramento e na avaliação das políticas educacionais, tendo em vista a melhoria da qualidade do ensino e da aprendizagem.", "metas": [{"id": "15.a", "texto": "Assegurar que todos os diretores de escolas públicas sejam selecionados por meio de processo seletivo fundamentado em critérios técnicos de mérito e desempenho, seguido de escuta da comunidade escolar."}, {"id": "15.b", "texto": "Assegurar que todas as escolas públicas da educação básica tenham conselhos escolares instituídos e em pleno funcionamento, em consonância com a Lei nº 14.644, de 2 de agosto de 2023, com a participação dos diferentes segmentos da comunidade escolar."}, {"id": "15.c", "texto": "Assegurar que o município de Rosário do Catete, tenha fórum de educação como instância permanente de participação social, instituídos por lei, em funcionamento."}], "estrategias": [{"id": "15.1", "texto": "Implementar, em regime de colaboração, diretrizes nacionais de qualidade da gestão escolar democrática na educação pública, abrangidas dimensões como a capacidade administra-tiva, pedagógica e de diálogo com a comunidade local, a qualificação profissional, a proposta de gestão para a escola e as desigualdades comuns à sociedade brasileira."}, {"id": "15.2", "texto": "Implementar, em regime de colaboração, política nacional de desenvolvimento para a gestão escolar democrática, com diretrizes e parâmetros destinados a referenciar as competên-cias necessárias ao trabalho dos gestores e promover a garantia de participação de todos os profissionais da educação no projeto pedagógico e demais instrumentos de planejamento, com fundamento no princípio da gestão democrática na educação pública e com base na utilização de dados educacionais para a tomada de decisões."}, {"id": "15.3", "texto": "Fomentar, por meio de cooperação intergovernamental, a oferta de formação específica em gestão democrática, e garantir que todos os gestores sejam avaliados de forma regular e periódica, com garantia de publicidade e transparência acerca dos critérios de avaliação, nos termos de suas respectivas carreiras."}, {"id": "15.4", "texto": "Assegurar a efetivação da gestão democrática da educação por meio das instâncias colegiadas intraescolares e extraescolares para as quais seja garantida a autonomia e fomen-tada a qualificação de seus membros, com o apoio técnico e financeiro e o fortalecimento da participação social."}, {"id": "15.5", "texto": "Assegurar condições adequadas ao funcionamento de conselhos escolares para a elabo-ração, a implementação e a avaliação do projeto pedagógico e do material didático, bem como dos demais instrumentos formais de planejamento da escola, garantida a representatividade e ampla participação dos vários segmentos da comunidade escolar."}, {"id": "15.6", "texto": "Incentivar o devido financiamento público e assegurar as condições para o funcionamento regular do fórum de educação como instâncias permanentes e representativas de participação social na elaboração, no acompanhamento e na avaliação dos planos decenais de educação e de coordenação e articulação das conferências de educação, orientadas por estudos acadêmicos, estatísticas e indicadores oficiais, garantida a representatividade, e com plataformas digitais amplamente acessíveis para participação popular no monitoramento dos planos decenais de educação."}, {"id": "15.7", "texto": "Assegurar a elaboração do projeto pedagógico como orientador da gestão escolar demo-crática, articulando-o às necessidades locais e garantindo a participação da comunidade."}, {"id": "15.8", "texto": "Estabelecer mecanismos de comunicação e de convivência entre a equipe escolar, os estudantes, os pais ou os responsáveis, com o objetivo de fortalecer os vínculos entre a escola e a comunidade e de prevenir e combater a violência em âmbito escolar."}, {"id": "15.9", "texto": "Promover processos e instrumentos de autoavaliação participativa das escolas públicas, bem como de monitoramento, no âmbito do projeto pedagógico e nos demais instrumentos de planejamento escolar, relativos aos vínculos entre escola e comunidade."}, {"id": "15.10", "texto": "Criar mecanismos de apoio técnico às instâncias colegiadas para a elaboração, o acom-panhamento e o controle social das políticas educacionais, assegurados o interesse público, o compartilhamento de experiências com a difusão de boas práticas e a disseminação de instru-mentos destinados à ampla participação da sociedade em favor de uma educação de qualidade."}, {"id": "15.11", "texto": "Implementar em todos os territórios, especialmente nos indígenas, quilombolas, do campo, das águas e das florestas e nas periferias urbanas, políticas públicas Inter setoriais que promovam escuta, inclusão e equidade na garantia do direito à educação."}, {"id": "15.12", "texto": "Garantir e ampliar os mecanismos de transparência, acesso à informação e controle social sobre as atividades do FME e das Conferências de educação, incluindo, entre outros, a divulgação pública de atas e dos documentos produzidos, assegurando a participação efetiva da sociedade no acompanhamento e na fiscalização dessas instâncias."}]}, {"num": 16, "title": "Financiamento e Infraestrutura da Educação", "objetivo": "Assegurar a qualidade e a equidade nas condições de oferta e permanência da educação básica.", "metas": [{"id": "16.a", "texto": "Acompanhar a ampliação do investimento público em educação, de modo a atingir o equivalente do PIB proposto no PNE até o final do decênio no sentido de promover a progressiva elevação da qualidade da oferta da educação básica, observado o disposto no art. 13 e nos §§ 6º e 7º do art. 7º desta Lei."}, {"id": "16.b", "texto": "Alcançar o investimento por aluno da educação básica, consideradas apenas as despesas correntes e aquelas relativas à manutenção da infraestrutura escolar existente, como percentual do PIB per capita equivalente à média dos países da Organização para a Cooperação e Desen-volvimento Econômico (OCDE) até o final de vigência deste PME, e, até o final do decênio, alcançar investimento por aluno da educação básica que assegure, para todos os entes federati-vos, padrão mínimo de qualidade, consideradas as gressiva, os fatores de ponderação do Valor Anual por Aluno (VAAF), uma vez definidos os padrões de qualidade para cada etapa, modalidade, jornada, tipo de escola e público da educação básica."}, {"id": "16.4", "texto": "Instituir, em regime de colaboração, padrões de qualidade de oferta de infraestrutura escolar em níveis mínimos, básicos e adequados, considerando, necessariamente, espaço mínimo por aluno."}, {"id": "16.5", "texto": "Aplicar os critérios definidos para a distribuição de recursos adicionais dirigidos à educação ao longo do decênio que considerem a equalização das oportunidades educacionais e as vulnerabilidades socioeconômicas, socioambientais, raciais, de sexo e regionais."}, {"id": "16.6", "texto": "Acompanhar indicadores que apontem, por rede de ensino, a proporção dos recursos da educação destinados aos gastos com os profissionais da educação e, especificamente, com os do magistério, de forma a subsidiar o planejamento e a avaliação das políticas de financiamento da educação básica."}, {"id": "16.7", "texto": "Suplementar, com recursos oriundos da União e consideradas as especificidades regi-onais de custos, a melhoria das condições de oferta relacionadas às despesas correntes, como alimentação, transporte e valorização dos profissionais da educação básica pública, incluída a formação inicial e continuada, e das condições relacionadas às despesas de capital, como a infraestrutura escolar, incluindo equipamentos, mobiliário e tecnologia digital."}, {"id": "16.8", "texto": "Buscar novas fontes de financiamento, para além da receita resultante de impostos e contribuições vinculada ao investimento em Manutenção e Desenvolvimento do Ensino (MDE)."}, {"id": "16.9", "texto": "Reduzir progressivamente as desigualdades de infraestrutura escolar e de gastos cor-rentes, no âmbito de cada rede de ensino, assegurando a ação redistributiva do município em relação às suas próprias escolas, em conformidade com o § 6º do art. 211 da Constituição Federal, consideradas as desigualdades territoriais, socioeconômicas e raciais."}, {"id": "16.10", "texto": "Alinhar o plano plurianual (PPA), a lei de diretrizes orçamentárias (LDO) e a lei orçamentária anual (LOA) às disposições do plano municipal de educação."}, {"id": "16.11", "texto": "Aperfeiçoar os instrumentos de planejamento, gestão, monitoramento e avaliação das políticas públicas de investimento em infraestrutura educacional."}, {"id": "16.12", "texto": "Acompanhar a arrecadação e o uso da contribuição social do salário-educação, através dos instrumentos de divulgação oficial."}, {"id": "16.13", "texto": "Aprimorar o controle interno, externo e social do uso dos recursos públicos da educação."}, {"id": "16.14", "texto": "Elaborar indicadores, desagregados por etapa e modalidade, que permitam avaliar a efetividade do investimento público em educação básica para a ampliação do acesso e da permanência, bem como para a melhoria da qualidade da oferta e dos resultados, com redução das desigualdades, aferidos pelo sistema nacional de avaliação da educação básica."}, {"id": "16.15", "texto": "Ampliar, fortalecer e diversificar os instrumentos de assistência estudantil para os estudantes que estejam em situação de vulnerabilidade socioeconômica, que sejam integrantes de famílias cuja renda familiar per capita seja insuficiente para custear os estudos em cursos de graduação de instituições de ensino superior privadas ou que se encontrem em ambas as situações."}, {"id": "16.16", "texto": "Fortalecer os mecanismos e os instrumentos que assegurem a transparência e o controle social na utilização dos recursos públicos aplicados em educação, bem como a divulgação anual de dados relativos aos dispêndios e aos custos por estudante, em cada nível e etapa."}, {"id": "16.17", "texto": "Fomentar a avaliação, a revisão e o aperfeiçoamento do instrumento de colaboração entre Estados e Municípios formalizado na legislação estadual, em cumprimento ao inciso IV do § 1º do art. 14 da Lei nº 14.113, de 25 de dezembro de 2020, considerando o disposto na Emenda Constitucional nº 132, de 20 de dezembro de 2023."}]}]}];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function home(){const n=EMD.length;return `<h2>Grupos de Trabalho</h2><p class="mu">Cada GT abre em modo de projeção. Tudo o que for registrado aparece em tempo real na Plenária Final.</p>

function gtView(g){const c=pos(g),m=g.metas[c.mi],L=m.estrategias.length;
 const tabs=g.metas.map((x,i)=>`<button class="${i===c.mi?'on':''}" data-meta="${i}">Meta ${x.num}</button>`).join('');
 let body;
 if(c.si<0){const ap=MET['m_'+m.num]?.ok;

 }else if(c.si<L){const e=m.estrategias[c.si],s=status(e.id),a=EMD.filter(x=>x.est===e.id).sort((x,y)=>x.ts-y.ts);
  body=`<div class="row"><b class="mid">Estratégia ${e.id}</b>${chip(s)}<span class="mu sp">${c.si+1} de ${L}</span></div>
  <div class="card big">${esc(e.texto)}</div>${a.map(x=>amHtml(x,1)).join('')}
  <div class="row"><button class="${EST[sid(e.id)]?.ok?'ok':''}" data-ok="${e.id}">${EST[sid(e.id)]?.ok?'✔ Aprovada sem alteração (desfazer)':'Aprovar sem alteração'}</button><button class="p" data-emenda="${e.id}">Propor emenda</button></div>`;
 }else{const nv=EMD.filter(x=>x.est==='nova-'+m.num).sort((x,y)=>x.ts-y.ts);

 const last=c.si>=L;
 return `<div class="row"><h2 style="margin:0">${g.gt} <span class="mu" style="font-weight:400;font-size:1rem">${g.desc}</span></h2><span class="sp row"><button data-fs="-1">A−</button><button data-fs="1">A+</button><button data-full>Tela cheia</button></span></div>
 <div class="tabs" style="margin:10px 0">${tabs}</div>${body}
 <div class="row card"><button data-nav="-1">← Anterior</button><button data-nova="${m.num}">+ Nova estratégia</button><button class="p sp" data-nav="1">${last?(c.mi<g.metas.length-1?'Próxima meta →':'Fim'):'Próxima →'}</button></div>
 <div class="mu">Atalhos: ← → para navegar.</div>`}
function plen(){const gs=DATA.filter(g=>F.gt==='todos'||g.gt===F.gt);const done=EMD.filter(x=>x.status!=='votacao');
 const cnt=(f)=>EMD.filter(f).length;
 let h=`<h2>Plenária Final – consolidado em tempo real</h2><div class="grid">
 ${[['Emendas aprovadas',cnt(x=>x.tipo!=='nova'&&x.status==='aprovada')],['Emendas rejeitadas',cnt(x=>x.tipo!=='nova'&&x.status==='rejeitada')],['Novas estratégias aprovadas',cnt(x=>x.tipo==='nova'&&x.status==='aprovada')],['Em votação',cnt(x=>x.status==='votacao')],['Destaques',cnt(x=>x.destaque)]].map(a=>`<div class="card"><div class="mu">${a[0]}</div><div class="big"><b>${a[1]}</b></div></div>`).join('')}</div>
 <div class="row card"><label style="margin:0">GT</label><select id="fgt" style="width:auto"><option value="todos">Todos</option>${DATA.map(g=>`<option ${F.gt===g.gt?'selected':''}>${g.gt}</option>`).join('')}</select>
 <label style="margin:0">Exibir</label><select id="fsf" style="width:auto"><option value="delib" ${F.sf==='delib'?'selected':''}>Só com deliberação</option><option value="dest" ${F.sf==='dest'?'selected':''}>Só destaques</option><option value="todas" ${F.sf==='todas'?'selected':''}>Todas as estratégias</option></select>
 <button class="sp" data-export>Baixar relatório (.md)</button></div>`;
 for(const g of gs){h+=`<h3>${g.gt} <span class="mu" style="font-weight:400">${g.desc}</span></h3>`;
  for(const m of g.metas){const rows=[];
   for(const e of m.estrategias){const a=EMD.filter(x=>x.est===e.id).sort((x,y)=>x.ts-y.ts),s=status(e.id);

   const nv=EMD.filter(x=>x.est==='nova-'+m.num).sort((x,y)=>x.ts-y.ts).filter(x=>F.sf!=='dest'||x.destaque);
   if(nv.length)rows.push(`<div class="card"><b>Novas estratégias propostas</b>${nv.map(x=>amHtml(x,0)+`<div class="row"><button data-dest="${x.id}">${x.destaque?'Remover destaque':'Marcar destaque'}</button></div>`).join('')}</div>`);
   if(rows.length||F.sf==='todas')h+=`<h4>Meta ${m.num} – ${esc(m.title)} ${MET['m_'+m.num]?.ok?'<span class="chip ok">Metas aprovadas</span>':''}</h4>`+rows.join('')}}

 for(const g of DATA){t+=`## ${g.gt} – ${g.desc}\n\n`;for(const m of g.metas){t+=`### Meta ${m.num} – ${m.title}${MET['m_'+m.num]?.ok?' (metas aprovadas)':''}\n\n`;
  for(const e of m.estrategias){const a=EMD.filter(x=>x.est===e.id),s=status(e.id);if(s[0]==='Pendente'&&!a.length)continue;

 return t}
